<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMS — Teacher Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Use CSV imports in the hosted edition; third-party executable scripts are not loaded. -->
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#101819;
    --surface:#192426;
    --ink:#E6EFED;
    --ink-soft:#B0C2BF;
    --ink-faint:#93AAA6;
    --line:#344744;
    --teal:#0E6B63;
    --teal-dark:#83DDC9;
    --teal-pale:#193E37;
    --amber:#F0BC66;
    --amber-pale:#3E3320;
    --red:#F39183;
    --red-pale:#402A29;
    --green:#80CEA0;
    --green-pale:#203A2C;
    --indigo:#B3B4F1;
    --indigo-pale:#303149;
    --rose:#EDA0BD;
    --rose-pale:#412C37;
    --violet:#CAA9ED;
    --violet-pale:#372D44;
    --radius:10px;
    --shadow: 0 1px 2px rgba(23,38,42,0.06), 0 6px 20px rgba(23,38,42,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Sora',sans-serif;margin:0;letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{display:flex;min-height:100vh;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:246px;flex:0 0 246px;
    background:var(--teal-dark);
    color:#EFF6F4;
    padding:20px 14px 16px;
    display:flex;flex-direction:column;gap:20px;
    position:sticky;top:0;height:100vh;
    overflow-y:auto;
    z-index:60;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 4px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;background:#0E6B63;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    font-family:'Sora';font-weight:800;color:#101819;font-size:15px;
    border:1.5px solid rgba(255,255,255,0.25);
  }
  .brand-text h1{font-size:16px;color:#fff;}
  .brand-text span{font-size:10.5px;color:#9FC4BE;letter-spacing:0.04em;text-transform:uppercase;}
  .sidebar-close{display:none;}

  .nav-block{display:flex;flex-direction:column;}
  .nav-block+.nav-block{margin-top:2px;}
  .role-picker-label{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#82AEA7;font-weight:700;padding:0 8px;margin-bottom:8px;}
  .role-btn{
    text-align:left;padding:10px 10px;border-radius:9px;border:1px solid transparent;
    background:transparent;color:#D3E9E4;font-size:13.5px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:10px;width:100%;font-family:'Inter';
    line-height:1.25;
  }
  .role-btn .icon{font-size:15px;flex:0 0 auto;width:18px;text-align:center;}
  .role-btn:hover{background:rgba(255,255,255,0.07);}
  .role-btn.active{background:#0E6B63;color:#fff;border-color:rgba(255,255,255,0.2);box-shadow:0 2px 6px rgba(0,0,0,0.18);}
  .role-btn:focus-visible{outline:2px solid #7FE3C9;outline-offset:1px;}

  .subnav{display:flex;flex-direction:column;gap:2px;margin:5px 0 8px 8px;padding-left:10px;border-left:1.5px solid rgba(255,255,255,0.14);}
  .subnav button{
    text-align:left;background:none;border:none;color:#AFD3CC;padding:8px 10px;
    border-radius:7px;font-size:12.6px;cursor:pointer;font-family:'Inter';font-weight:500;
    display:flex;align-items:center;gap:8px;width:100%;
  }
  .subnav button .icon{font-size:12px;opacity:0.85;}
  .subnav button:hover{background:rgba(255,255,255,0.07);color:#fff;}
  .subnav button.active{background:rgba(255,255,255,0.12);color:#fff;font-weight:700;}
  .subnav button:focus-visible{outline:2px solid #7FE3C9;outline-offset:1px;}

  .sidebar-foot{margin-top:auto;font-size:10.8px;color:#7CA39C;line-height:1.55;padding:12px 8px 2px;border-top:1px solid rgba(255,255,255,0.12);}
  .sync-status{display:flex;align-items:center;gap:6px;font-size:10.8px;color:#7CA39C;padding:0 8px;}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:#4E8C82;flex:0 0 auto;}
  .sync-dot.err{background:var(--red);}

  .mobile-menu-btn{display:none;}
  .sidebar-backdrop{display:none;}

  /* ---------- MAIN ---------- */
  main{flex:1;padding:26px 34px 60px;max-width:1180px;}
  .topbar{
    display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px;flex-wrap:wrap;
  }
  .topbar h2{font-size:21px;}
  .topbar .sub{color:var(--ink-soft);font-size:13px;margin-top:3px;}
  .identity{
    display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:9px 12px;box-shadow:var(--shadow);flex-wrap:wrap;
  }
  .identity input, .identity select{
    border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12.5px;font-family:inherit;
    background:#142022;color:var(--ink);
  }
  .identity label{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:2px;}
  .idfield{display:flex;flex-direction:column;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px;}
  .card h3{font-size:14.5px;margin-bottom:2px;}
  .card .hint{color:var(--ink-soft);font-size:12px;margin-bottom:14px;}

  .grid-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .grid-toolbar select, .grid-toolbar input{
    border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:12.5px;background:#142022;font-family:inherit;
  }

  .btn{
    border:none;border-radius:7px;padding:8px 14px;font-size:12.8px;font-weight:600;cursor:pointer;
    font-family:'Inter';display:inline-flex;align-items:center;gap:6px;transition:filter .12s;
  }
  .btn:hover{filter:brightness(0.95);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-red{background:var(--red);color:#fff;}
  .btn-ghost{background:#283835;color:var(--ink);}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-amber{background:var(--amber);color:#fff;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-sm{padding:5px 10px;font-size:11.5px;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.01em;white-space:nowrap;}
  .b-scheduled{background:#303149;color:#B3B4F1;}
  .b-live{background:var(--teal-pale);color:var(--teal);}
  .b-completed{background:var(--green-pale);color:var(--green);}
  .b-cancelled{background:var(--red-pale);color:var(--red);text-decoration:line-through;}
  .b-pending{background:var(--amber-pale);color:var(--amber);}
  .b-noshow{background:var(--red-pale);color:var(--red);}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulse 1.3s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(14,107,99,0.55);}70%{box-shadow:0 0 0 6px rgba(14,107,99,0);}100%{box-shadow:0 0 0 0 rgba(14,107,99,0);}}

  .vpill{padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:0.02em;}
  .tpill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700;white-space:nowrap;}
  .tp-acad{background:var(--teal-pale);color:var(--teal-dark);}
  .tp-non{background:var(--amber-pale);color:#F0BC66;}
  .md-on{background:var(--indigo-pale);color:var(--indigo);}
  .md-off{background:#283835;color:var(--ink-soft);}
  .room-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  .dropzone{border:1.5px dashed #4E6560;border-radius:10px;padding:22px 16px;text-align:center;background:#142022;cursor:pointer;transition:border-color .12s,background .12s;}
  .dropzone:hover,.dropzone:focus-visible{border-color:var(--teal);outline:none;}
  .dropzone.drag{border-color:var(--teal);background:var(--teal-pale);}
  .dropzone b{color:var(--teal-dark);}
  .dz-sub{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
  .bulk-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;}
  .bulk-summary{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 8px;}
  .bulk-summary .badge{font-size:11.5px;}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  tr.row-err td{background:#352526;}
  tr.row-warn td{background:#342F23;}
  .issue-list{margin:0;padding-left:16px;font-size:11.5px;}
  .issue-list li.e{color:var(--red);}
  .issue-list li.w{color:#F0BC66;}
  .col-map{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  details.more{margin-top:12px;}
  details.more summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--teal-dark);}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  @media(max-width:900px){.two-col{grid-template-columns:1fr;}}
  .ov-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .action-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
  @media(max-width:800px){.action-tiles{grid-template-columns:1fr;}}
  .action-tile{display:flex;align-items:center;gap:14px;text-align:left;border:none;border-radius:var(--radius);padding:16px 18px;cursor:pointer;color:#fff;font-family:inherit;box-shadow:var(--shadow);transition:transform .08s ease, filter .12s ease;}
  .action-tile:hover{filter:brightness(1.07);}
  .action-tile:active{transform:translateY(1px);}
  .action-tile:focus-visible{outline:3px solid var(--ink);outline-offset:2px;}
  .action-tile .at-icon{flex:none;width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;}
  .action-tile .at-title{font-family:'Sora';font-weight:700;font-size:15px;line-height:1.2;}
  .action-tile .at-sub{font-size:12px;opacity:0.88;margin-top:3px;line-height:1.35;}
  .action-tile.t-new{background:var(--teal);}
  .action-tile.t-bulk{background:var(--indigo);}
  .action-tile.t-rec{background:var(--amber);}
  .action-tile.is-open{box-shadow:0 0 0 3px var(--surface),0 0 0 5px currentColor;color:#fff;}
  .action-tile.is-open.t-new{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--teal);}
  .action-tile.is-open.t-bulk{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--indigo);}
  .action-tile.is-open.t-rec{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--amber);}
  @media (prefers-reduced-motion: reduce){.action-tile{transition:none;}}
  .persona{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:10px;margin:14px 0 14px;display:flex;flex-direction:column;gap:6px;}
  .persona label{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#82AEA7;font-weight:700;}
  .persona select,.persona input{width:100%;border:1px solid rgba(255,255,255,0.18);background:rgba(0,0,0,0.18);color:#fff;border-radius:7px;padding:7px 8px;font-size:12.5px;font-family:inherit;}
  .persona select option,.persona select optgroup{color:#E6EFED;background:#fff;}
  .persona input::placeholder{color:#8FB3AC;}
  .persona select:focus-visible,.persona input:focus-visible{outline:2px solid #7FE3C9;outline-offset:1px;}
  .persona .p-note{font-size:11px;color:#9FC4BE;line-height:1.4;}
  .nav-badge{margin-left:auto;background:var(--amber);color:#fff;border-radius:10px;font-size:10.5px;font-weight:800;padding:1px 7px;}
  .who-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--ink-soft);}
  .quick-create{margin:10px 0 4px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.12);display:flex;flex-direction:column;gap:6px;}
  .qc-btn{display:flex;align-items:center;gap:8px;width:100%;border:none;border-radius:8px;padding:9px 11px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:#fff;text-align:left;}
  .qc-btn.q-new{background:#12887E;}
  .qc-btn.q-bulk{background:#5A5FA8;}
  .qc-btn.q-rec{background:#B87A18;}
  .qc-btn:hover{filter:brightness(1.1);}
  .qc-btn:focus-visible{outline:2px solid #7FE3C9;outline-offset:1px;}
  .ov-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .panel-close{margin-left:auto;}
  .opt-line{font-size:12.5px;display:flex;align-items:center;gap:6px;}

  .class-card{border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:10px;background:#172224;}
  .class-card.is-live{border-color:var(--teal);background:#16312C;}
  .class-card.is-warn{border-color:var(--red);background:#352526;}
  .cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .cc-title{font-family:'Sora';font-weight:700;font-size:14.5px;}
  .cc-meta{color:var(--ink-soft);font-size:12px;margin-top:3px;}
  .cc-time{font-family:'JetBrains Mono';font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .cc-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center;}
  .geo-note{font-size:11.5px;color:var(--ink-faint);display:flex;align-items:center;gap:5px;}
  .geo-note.ok{color:var(--green);font-weight:600;}
  .geo-note.bad{color:var(--red);font-weight:600;}

  .warn-banner{margin-top:10px;background:var(--red-pale);color:var(--red);border-radius:7px;padding:9px 12px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;}

  .req-form{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;display:none;gap:8px;flex-direction:column;}
  .req-form.open{display:flex;}
  .req-form textarea, .req-form input{border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:12.5px;font-family:inherit;background:#142022;}
  .req-row{display:flex;gap:8px;flex-wrap:wrap;}
  .req-row>*{flex:1;min-width:120px;}

  table{width:100%;border-collapse:collapse;font-size:12.6px;}
  th{text-align:left;color:var(--ink-faint);text-transform:uppercase;font-size:10.3px;letter-spacing:0.05em;font-weight:700;padding:6px 10px;border-bottom:1px solid var(--line);}
  td{padding:8px 10px;border-bottom:1px solid #2E403D;vertical-align:middle;}
  tr:hover td{background:#21312E;}

  .empty{color:var(--ink-faint);font-size:12.8px;padding:20px 4px;text-align:center;}

  textarea.bulk{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:'JetBrains Mono';font-size:12px;background:#142022;}

  .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px;}
  .form-grid .fg{display:flex;flex-direction:column;gap:3px;}
  .form-grid label{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.04em;}
  .form-grid input, .form-grid select{border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12.5px;background:#142022;font-family:inherit;}

  .center-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid #2E403D;}
  .center-row:last-child{border-bottom:none;}
  .center-name{font-weight:700;font-size:13px;}
  .center-meta{font-size:11.5px;color:var(--ink-soft);}

  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  .kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 16px;position:relative;overflow:hidden;}
  .kpi-card .kpi-accent{position:absolute;top:0;left:0;width:100%;height:3px;}
  .kpi-label{font-size:10.8px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint);font-weight:700;}
  .kpi-value{font-family:'Sora';font-size:26px;font-weight:800;margin-top:4px;line-height:1.1;}
  .kpi-value small{font-size:14px;font-weight:600;color:var(--ink-soft);}
  .kpi-sub{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .kpi-sub.good{color:var(--green);font-weight:600;}
  .kpi-sub.bad{color:var(--red);font-weight:600;}
  .kpi-sub.warn{color:var(--amber);font-weight:600;}

  .range-tabs{display:inline-flex;gap:3px;background:#283835;border-radius:8px;padding:3px;}
  .range-tabs button{border:none;background:none;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:'Inter';}
  .range-tabs button.active{background:var(--teal);color:#fff;}

  .dash-cols{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start;}
  @media(max-width:900px){.dash-cols{grid-template-columns:1fr;} .kpi-grid{grid-template-columns:repeat(2,1fr);}}

  .barlist-row{display:grid;grid-template-columns:150px 1fr 48px;align-items:center;gap:10px;margin-bottom:9px;font-size:12.3px;}
  .barlist-row .lbl{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .barlist-track{background:#283835;border-radius:5px;height:9px;overflow:hidden;}
  .barlist-fill{height:100%;border-radius:5px;background:var(--teal);}
  .barlist-row .val{text-align:right;color:var(--ink-soft);font-family:'JetBrains Mono';font-size:11.5px;}

  .stackbar{display:flex;height:14px;border-radius:7px;overflow:hidden;width:100%;margin:8px 0 12px;}
  .stackbar-seg{height:100%;}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--ink-soft);}
  .legend-item{display:flex;align-items:center;gap:5px;}
  .legend-dot{width:8px;height:8px;border-radius:50%;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-head{margin-bottom:4px;}
  .cal-headcell{text-align:center;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint);font-weight:700;padding:4px 0;}
  .cal-cell{min-height:62px;border:1px solid var(--line);border-radius:8px;padding:6px 6px;background:#172224;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:border-color .1s;}
  .cal-cell:hover{border-color:var(--teal);}
  .cal-cell.empty-cell{background:transparent;border:none;cursor:default;}
  .cal-cell.is-today .cal-daynum{background:var(--teal);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;}
  .cal-cell.is-selected{border-color:var(--teal-dark);box-shadow:0 0 0 2px var(--teal-pale) inset;}
  .cal-cell.has-classes{background:#1C2B29;}
  .cal-daynum{font-size:12px;font-weight:700;color:var(--ink);}
  .cal-dots{display:flex;gap:3px;flex-wrap:wrap;align-items:center;}
  .cal-dot{width:6px;height:6px;border-radius:50%;}
  .cal-more{font-size:9.5px;color:var(--ink-faint);font-weight:700;}
  @media(max-width:800px){.cal-cell{min-height:44px;}}

  .toast-alert{position:fixed;top:18px;right:18px;background:var(--red);color:#fff;padding:14px 18px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,0.2);font-size:13px;font-weight:600;z-index:999;max-width:320px;display:none;}
  .tag{display:inline-flex;align-items:center;gap:6px;background:var(--teal-pale);color:var(--teal-dark);border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:600;}
  .tag button{background:none;border:none;color:var(--teal-dark);cursor:pointer;font-weight:700;}

  @media(max-width:800px){
    .sidebar{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .22s ease;box-shadow:6px 0 24px rgba(0,0,0,0.25);}
    .sidebar.open{transform:translateX(0);}

<script>
window.storage=undefined;
/* ================= UTILITIES ================= */
const uid = () => 'x' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const todayISO = () => {const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const DAY_NAMES = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
function dayNameFor(iso){ return DAY_NAMES[new Date(iso+'T00:00:00').getDay()]; }
function fmtDate(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function to12h(hhmm){
  if(!hhmm) return '—';
  const [h,m]=hhmm.split(':').map(Number);
  const ap = h>=12?'PM':'AM';
  let hh = h%12; if(hh===0) hh=12;
  return `${hh}:${String(m).padStart(2,'0')} ${ap}`;
}
function minutesOfDay(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
function scheduledDuration(s){ return Math.max(0, minutesOfDay(s.endTime)-minutesOfDay(s.startTime)); }
function elapsedMinutes(fromIso){ return Math.max(0, Math.round((Date.now()-new Date(fromIso).getTime())/60000)); }
function haversineMeters(lat1,lon1,lat2,lon2){
  const R=6371000, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function showToast(msg, ms=6000){
  const t=document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>{t.style.display='none';}, ms);
  if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification('TMS — class alert', {body:msg}); }catch(e){}
  }
}

const VERTICAL_COLORS = {
  'NEET/JEE':{bg:'var(--rose-pale)',fg:'var(--rose)'},
  'PSC':{bg:'var(--teal-pale)',fg:'var(--teal-dark)'},
  'UPSC':{bg:'var(--indigo-pale)',fg:'var(--indigo)'},
  'SSC':{bg:'var(--amber-pale)',fg:'var(--amber)'},
  'IAS':{bg:'var(--violet-pale)',fg:'var(--violet)'},
  'Tuition':{bg:'var(--green-pale)',fg:'var(--green)'}
};
function vpill(v){
  const c = VERTICAL_COLORS[v] || {bg:'#EEE',fg:'#555'};
  return `<span class="vpill" style="background:${c.bg};color:${c.fg}">${v}</span>`;
}
function statusBadge(s){
  const map={
    scheduled:['b-scheduled','Scheduled'],
    live:['b-live','<span class="pulse"></span> Live'],
    completed:['b-completed','Completed'],
    cancelled:['b-cancelled','Cancelled']
  };
  const [cls,label]=map[s]||['b-scheduled',s];
  return `<span class="badge ${cls}">${label}</span>`;
}

/* ================= STATE ================= */
const STORAGE_KEY = 'tms-schedule-app-v1';

/* ---- Session types, programs & classrooms ---- */
const SESSION_TYPES = { 'academic':'Academic', 'non-academic':'Non-academic' };
const SESSION_CATEGORIES = {
  'academic': ['Lecture','Revision','Doubt Clearing','Test / Exam','Practical / Lab'],
  'non-academic': ['Orientation','Parent-Teacher Meeting','Seminar / Motivation','Event / Celebration','Mentoring / Counselling','Staff Meeting / Training','Other']
};
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normType(v){
  const t = String(v||'').toLowerCase().replace(/[^a-z]/g,'');
  if(!t) return '';
  if(t.startsWith('non')) return 'non-academic';
  if(t.startsWith('acad')) return 'academic';
  return null;
}
function typeOf(s){ return s.sessionType || 'academic'; }
function typePill(s){
  const t = typeOf(s);
  return `<span class="tpill ${t==='academic'?'tp-acad':'tp-non'}">${SESSION_TYPES[t]||t}${s.category?' · '+esc(s.category):''}</span>`;
}
function classroomRec(id){ return (state.classrooms||[]).find(r=>r.id===id); }
function classroomName(id){ const r=classroomRec(id); return r?r.name:'—'; }
function roomsFor(centerId){ return (state.classrooms||[]).filter(r=>r.center===centerId).sort((a,b)=>a.name.localeCompare(b.name)); }
function programsFor(centerId, vertical){ return (state.programs||[]).filter(b=>b.center===centerId && (!vertical || b.vertical===vertical)).sort((a,b)=>a.name.localeCompare(b.name)); }
function programRec(s){
  if(s.programId){ const b=(state.programs||[]).find(x=>x.id===s.programId); if(b) return b; }
  return (state.programs||[]).find(b=>b.center===s.center && b.name.toLowerCase()===String(s.program||'').toLowerCase());
}
function programLabel(s){ return (s.program && s.program!=='—') ? s.program : (typeOf(s)==='non-academic' ? 'All programs / general' : '—'); }
function batchesOf(programId){ return (state.batches||[]).filter(b=>b.programId===programId).sort((a,b)=>a.name.localeCompare(b.name)); }
function batchRec(s){
  if(s.batchId){ const b=(state.batches||[]).find(x=>x.id===s.batchId); if(b) return b; }
  const p=programRec(s); if(!p || !s.batch) return null;
  return batchesOf(p.id).find(b=>b.name.toLowerCase()===String(s.batch).toLowerCase()) || null;
}
function batchLabel(s){ return s.batch ? s.batch : ((s.program && s.program!=='—') ? 'All batches' : '—'); }
const MODES = { offline:'Offline', online:'Online' };
function normMode(v){ const t=String(v||'').toLowerCase().replace(/[^a-z]/g,''); if(!t) return ''; if(t.startsWith('on')||t==='virtual'||t==='live') return 'online'; if(t.startsWith('off')||t==='classroom'||t==='physical') return 'offline'; return null; }
function modeOf(s){ return s.mode==='online' ? 'online' : 'offline'; }
function isOnline(s){ return modeOf(s)==='online'; }
function modePill(s){ const on=isOnline(s); return `<span class="tpill ${on?'md-on':'md-off'}">${on?'🌐 Online':'🏫 Offline'}</span>`; }
function safeLink(u){ return /^https?:\/\//i.test(String(u||'').trim()) ? String(u).trim() : ''; }
function cohortLabel(s){ return programLabel(s) + (s.batch ? ' · '+s.batch : ''); }
function sessionStrength(s){ const b=batchRec(s); if(b && b.strength) return b.strength; const p=programRec(s); return p && p.strength ? p.strength : null; }
function hasClassroomConflict(roomId, date, startTime, endTime, excludeId){
  if(!roomId) return null;
  const s1=minutesOfDay(startTime), e1=minutesOfDay(endTime);
  return state.schedules.find(s=> s.id!==excludeId && s.status!=='cancelled' && s.classroom===roomId && s.date===date && timeRangesOverlap(s1,e1,minutesOfDay(s.startTime),minutesOfDay(s.endTime)));
}
// Two sessions clash for students when they share a program and either is for the whole program or both are for the same batch.
// Different batches of one program can run side by side in different rooms.
function cohortsOverlap(batchA, batchB){ return !batchA || !batchB || String(batchA).toLowerCase()===String(batchB).toLowerCase(); }
function hasProgramConflict(program, centerId, date, startTime, endTime, excludeId, batch){
  if(!program || program==='—') return null;
  const s1=minutesOfDay(startTime), e1=minutesOfDay(endTime), p=program.toLowerCase();
  return state.schedules.find(s=> s.id!==excludeId && s.status!=='cancelled' && s.center===centerId && String(s.program||'').toLowerCase()===p && cohortsOverlap(batch, s.batch) && s.date===date && timeRangesOverlap(s1,e1,minutesOfDay(s.startTime),minutesOfDay(s.endTime)));
}
function newSessionRecord(d){
  return { id:uid(), status:'scheduled', actualStart:null, actualEnd:null, attendanceCount:null, attendanceTotal:null, coverage:null, createdAt:new Date().toISOString(),
    date:d.date, day:dayNameFor(d.date), sessionType:d.sessionType, category:d.category||'', subject:d.subject, chapter:d.chapter||'—', lectureNo:d.lectureNo||'—',
    faculty:d.faculty, center:d.center, vertical:d.vertical, program:d.program||'—', programId:d.programId||null, batch:d.batch||'', batchId:d.batchId||null, mode:d.mode==='online'?'online':'offline', link:d.mode==='online'?(d.link||''):'', classroom:d.mode==='online'?null:(d.classroom||null), startTime:d.startTime, endTime:d.endTime };
}
// One validator shared by the single form, the recurring series and the bulk uploader.
// `others` are rows earlier in the same upload so in-file clashes are caught before anything is saved.
function validateSession(d, others, excludeId){
  others = others || [];
  const E=[], W=[];
  const isAcad = d.sessionType==='academic';
  if(!d.sessionType) E.push('Session type must be "Academic" or "Non-academic".');
  if(!d.subject) E.push(isAcad ? 'Subject is required.' : 'Title is required.');
  if(!d.faculty) E.push(isAcad ? 'Faculty is required.' : 'Faculty / host is required.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date||'')) E.push('Date is missing or not a valid date.');
  const tOk = /^\d{2}:\d{2}$/.test(d.startTime||'') && /^\d{2}:\d{2}$/.test(d.endTime||'');
  if(!tOk) E.push('Start and end must be valid times (e.g. 09:00 or 9:00 AM).');
  else if(minutesOfDay(d.endTime)<=minutesOfDay(d.startTime)) E.push(`End time (${d.endTime}) must be after start time (${d.startTime}).`);
  if(isAcad && !d.program) E.push('Academic sessions need a program.');
  if(E.length) return { errors:E, warnings:W };

  const s1=minutesOfDay(d.startTime), e1=minutesOfDay(d.endTime);
  const roomKey = d.classroom || d.classroomKey || null;
  const fc = hasFacultyTimeConflict(d.faculty, d.date, d.startTime, d.endTime, excludeId);
  if(fc) W.push(`${d.faculty} already has "${fc.subject}" ${to12h(fc.startTime)}–${to12h(fc.endTime)} on this day.`);
  if(d.classroom){
    const rc = hasClassroomConflict(d.classroom, d.date, d.startTime, d.endTime, excludeId);
    if(rc) E.push(`${classroomName(d.classroom)} is already booked for "${rc.subject}" (${programLabel(rc)}) ${to12h(rc.startTime)}–${to12h(rc.endTime)}.`);
  }
  if(d.program){
    const bc = hasProgramConflict(d.program, d.center, d.date, d.startTime, d.endTime, excludeId, d.batch);
    if(bc) E.push(`${d.batch ? 'Batch "'+d.batch+'" of ' : ''}"${d.program}" already has "${bc.subject}"${bc.batch?' ('+bc.batch+')':' (whole program)'} ${to12h(bc.startTime)}–${to12h(bc.endTime)} at this time.`);
  }
  others.forEach(o=>{
    if(o.date!==d.date || !timeRangesOverlap(s1,e1,minutesOfDay(o.startTime),minutesOfDay(o.endTime))) return;
    if(o.faculty.toLowerCase()===d.faculty.toLowerCase()) W.push(`Overlaps ${o.__label||'another row'} for ${d.faculty}.`);
    if(roomKey && (o.classroom||o.classroomKey)===roomKey) E.push(`Same classroom as ${o.__label||'another row'} at an overlapping time.`);
    if(d.program && o.program && o.center===d.center && o.program.toLowerCase()===d.program.toLowerCase() && cohortsOverlap(d.batch, o.batch)) E.push(`"${cohortLabel(d)}" is also in ${o.__label||'another row'} at an overlapping time.`);
  });
  const rec = facultyRecord(d.faculty);
  if(!rec) W.push(`"${d.faculty}" isn't in Faculty mapping yet — they won't see this until mapped.`);
  else if(!rec.centers.includes(d.center) || !rec.verticals.includes(d.vertical)) W.push(`"${d.faculty}" isn't mapped to ${centerName(d.center)} / ${d.vertical} — hidden from their view until updated.`);
  const b = d.programId ? (state.programs||[]).find(x=>x.id===d.programId) : null;
  const r = d.classroom ? classroomRec(d.classroom) : null;
  const bt = d.batchId ? (state.batches||[]).find(x=>x.id===d.batchId) : null;
  const strength = (bt && bt.strength) || (!d.batch && b && b.strength) || null;
  if(strength && r && r.capacity && strength>r.capacity) W.push(`${bt?'Batch':'Program'} strength ${strength} is more than ${r.name}'s capacity of ${r.capacity}.`);
  if(b && !d.batch && isAcad && batchesOf(b.id).length) W.push(`No batch picked — this blocks every batch of "${b.name}" (${batchesOf(b.id).map(x=>x.name).join(', ')}).`);
  if(b && b.vertical!==d.vertical) W.push(`Program "${b.name}" is registered under ${b.vertical}, not ${d.vertical}.`);
  if(d.mode==='online'){
    if(d.link && !safeLink(d.link)) W.push('Class link should start with http:// or https:// — it will not be clickable.');
    if(!d.link) W.push('Online session has no class link yet.');
  } else if(isAcad && !roomKey && roomsFor(d.center).length) W.push('No classroom assigned.');
  const pm = d.programId ? ((state.programs||[]).find(x=>x.id===d.programId)||{}).mode : null;
  if(pm && d.mode && pm!==d.mode) W.push(`Program is set up as ${MODES[pm]} but this session is ${MODES[d.mode]}.`);
  if(isPastDate(d.date)) W.push('Date is in the past.');
  if(d.category && SESSION_CATEGORIES[d.sessionType] && !SESSION_CATEGORIES[d.sessionType].includes(d.category)) W.push(`"${d.category}" isn't a standard ${SESSION_TYPES[d.sessionType]} category — kept as typed.`);
  return { errors:[...new Set(E)], warnings:[...new Set(W)] };
}
function downloadBlob(filename, content, mime){
  try{
    const blob = content instanceof Blob ? content : new Blob([content], {type: mime||'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }catch(e){ showToast('Download was blocked by the browser — try opening this file directly.'); }
}
function toCSV(rows){
  return rows.map(r=>r.map(v=>{ const t=String(v==null?'':v); return /[",\n\t]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t; }).join(',')).join('\r\n');
}

let activeSubTab = { teacher:'today', coordinator:'overview', admin:'programs' };
let sidebarOpen = false;
let syncStatus = { ok:true, lastSync:null };

function defaultState(){
  const centers = [

// Fills in anything older saved data is missing so it keeps working after an upgrade.
function normalizeState(st){
  ['requests','centers','verticals','schedules','auditLog'].forEach(k=>{ if(!Array.isArray(st[k])) st[k]=[]; });
  if(!Array.isArray(st.classrooms)) st.classrooms = [];
  // Upgrade from the version where the program list was called "batches" and each session's program sat in s.batch.
  if(!Array.isArray(st.programs) && Array.isArray(st.batches) && st.batches.every(b=>b.center!==undefined)){
    st.programs = st.batches; st.batches = [];
  }
  st.schedules.forEach(s=>{
    if(s.program===undefined){ s.program = s.batch || '—'; s.programId = s.batchId || null; s.batch=''; s.batchId=null; }
  });
  if(!Array.isArray(st.batches)) st.batches = [];
  if(Array.isArray(st.programs)) st.programs.forEach(p=>{ if(p.mode!=='online' && p.mode!=='offline') p.mode='offline'; });
  if(!Array.isArray(st.programs)){
    st.programs = [];
    const seen = new Set();
    st.schedules.forEach(s=>{
      if(!s.program || s.program==='—') return;
      const key = s.center+'|'+s.program.toLowerCase();
      if(seen.has(key)) return; seen.add(key);
      st.programs.push({ id:uid(), name:s.program, center:s.center, vertical:s.vertical, strength:null, mode:'offline' });
    });
  }
  st.schedules.forEach(s=>{
    if(s.attendanceCount===undefined) s.attendanceCount=null;
    if(s.attendanceTotal===undefined) s.attendanceTotal=null;
    if(s.coverage===undefined) s.coverage=null;
    if(!s.sessionType) s.sessionType='academic';
    if(s.category===undefined) s.category = s.sessionType==='academic' ? 'Lecture' : 'Other';
    if(s.classroom===undefined) s.classroom=null;
    if(!s.programId && s.program && s.program!=='—'){
      const b = st.programs.find(x=>x.center===s.center && x.name.toLowerCase()===s.program.toLowerCase());
      s.programId = b ? b.id : null;
    }
    if(s.batch===undefined || s.batch==='—') s.batch='';
    if(s.mode!=='online' && s.mode!=='offline') s.mode='offline';
    if(s.link===undefined) s.link='';
    if(s.batchId===undefined) s.batchId=null;
    if(!s.batchId && s.batch && s.programId){
      const bt = st.batches.find(x=>x.programId===s.programId && x.name.toLowerCase()===s.batch.toLowerCase());
      s.batchId = bt ? bt.id : null;
    }
  });
  st.programs.forEach(p=>{ if(p.mode!=='online' && p.mode!=='offline') p.mode='offline'; });
  return st;
}

async function loadState(){
  let loaded = null;
  try{
    const r = await window.storage.get(STORAGE_KEY, true);
    if(r && r.value){ loaded = JSON.parse(r.value); }
    syncStatus = { ok:true, lastSync: Date.now() };
  }catch(e){ /* not found or error -> seed */ syncStatus = { ok:false, lastSync:null }; }
  if(loaded){
    if(!Array.isArray(loaded.faculty)) loaded.faculty = defaultState().faculty; // migrate older saved data
    return normalizeState(loaded);
  }
  const seeded = defaultState();
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(seeded), true); syncStatus={ok:true,lastSync:Date.now()}; }catch(e){ syncStatus={ok:false,lastSync:null}; }
  return seeded;
}
async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
    syncStatus = { ok:true, lastSync: Date.now() };
    return true;
  }catch(e){
    console.error('save failed', e);
    syncStatus = { ok:false, lastSync: syncStatus.lastSync };
    showToast('Your last change couldn\'t be saved — check your connection. Please allow browser storage and try again.', 6000);
    return false;
  }
}
// Pulls the latest shared state from storage so other people's changes show up here too.
// Skipped while a request/edit form is open so we don't yank input out from under someone typing.
async function backgroundSync(){
  if(expandedRequestForm) return;
  if(document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
  try{
    const r = await window.storage.get(STORAGE_KEY, true);
    if(r && r.value){
      const fresh = JSON.parse(r.value);
      if(!Array.isArray(fresh.faculty)) fresh.faculty = state.faculty;
      state = normalizeState(fresh);
      syncStatus = { ok:true, lastSync: Date.now() };
      // Admin screens hold half-filled forms and upload previews — don't wipe them on a background refresh.
      if(currentUser.role!=='admin' && !(currentUser.role==='coordinator' && window.__ovPanel)) render();
    }
  }catch(e){ syncStatus = { ok:false, lastSync: syncStatus.lastSync }; render(); }
}

/* ================= GEO ================= */
function startGeoWatch(){
  if(!navigator.geolocation){ currentGeo.error='Geolocation not supported by this browser.'; render(); return; }
  if(geoWatchId!==null) return;
  geoWatchId = navigator.geolocation.watchPosition(
    pos=>{
      currentGeo = { lat:pos.coords.latitude, lng:pos.coords.longitude, accuracy:pos.coords.accuracy, ts:Date.now(), error:null };
      render();
    },
    err=>{
      currentGeo.error = err.message || 'Could not get your location.';
      render();
    },
    { enableHighAccuracy:true, maximumAge:10000, timeout:10000 }
  );
}
function stopGeoWatch(){
  if(geoWatchId!==null){ navigator.geolocation.clearWatch(geoWatchId); geoWatchId=null; }
}
function distanceToCenter(centerId){
  const c = state.centers.find(x=>x.id===centerId);
  if(!c || currentGeo.lat===null) return null;
  return haversineMeters(currentGeo.lat, currentGeo.lng, c.lat, c.lng);
}
function isNearCenter(centerId){
  const c = state.centers.find(x=>x.id===centerId);
  if(!c) return false;
  const d = distanceToCenter(centerId);
  return d!==null && d<=c.radius;
}

/* ================= REQUESTS HELPERS ================= */
function pendingRequestFor(scheduleId){
  return state.requests.find(r=>r.scheduleId===scheduleId && r.status==='pending');
}
function centerName(id){ const c=state.centers.find(x=>x.id===id); return c?c.name:'Unknown centre'; }
function facultyRecord(code){ return (state.faculty||[]).find(f=>f.id.toLowerCase()===(code||'').toLowerCase()); }
function timeRangesOverlap(s1,e1,s2,e2){ return s1 < e2 && s2 < e1; }
function hasFacultyTimeConflict(facultyCode, date, startTime, endTime, excludeId){
  const s1 = minutesOfDay(startTime), e1 = minutesOfDay(endTime);
  return state.schedules.find(s=>{
    if(s.id===excludeId) return false;
    if(s.faculty.toLowerCase()!==facultyCode.toLowerCase()) return false;
    if(s.date!==date) return false;
    if(s.status==='cancelled') return false;
    return timeRangesOverlap(s1, e1, minutesOfDay(s.startTime), minutesOfDay(s.endTime));
  });
}
function hasFacultyLiveElsewhere(facultyCode, excludeId){
  return state.schedules.find(s=> s.id!==excludeId && s.status==='live' && s.faculty.toLowerCase()===facultyCode.toLowerCase());
}
function isPastDate(dateStr){ return dateStr < todayISO(); }
function isNoShowRisk(s){
  if(s.status!=='scheduled' || s.date!==todayISO()) return false;
  const now = new Date();
  const nowMin = now.getHours()*60+now.getMinutes();
  return (nowMin - minutesOfDay(s.startTime)) > 15;
}
function eligibleSubstitutes(s){
  return (state.faculty||[]).filter(f=> f.id.toLowerCase()!==s.faculty.toLowerCase() && f.centers.includes(s.center) && f.verticals.includes(s.vertical));
}
function logAudit(actor, action, details, scheduleId){
  if(!Array.isArray(state.auditLog)) state.auditLog = [];
  state.auditLog.push({ id:uid(), ts:new Date().toISOString(), actor: actor||'—', action, details: details||'', scheduleId: scheduleId||null });
  if(state.auditLog.length>500) state.auditLog = state.auditLog.slice(state.auditLog.length-500);
}

function timeAgo(ts){
  const s = Math.max(0, Math.round((Date.now()-ts)/1000));
  if(s<10) return 'just now';
  if(s<60) return s+'s ago';
  const m = Math.round(s/60);
  if(m<60) return m+'m ago';
  return Math.round(m/60)+'h ago';
}

  if(isStakeholderView()) return renderStakeholderToday();
  if(!currentUser.name){
    return `<div class="card"><div class="empty">Select your name / code above to see your classes.</div></div>`;
  }
  const { mine, flagged } = myScheduleSet();
  const sortFn = (a,b)=> (a.date+a.startTime).localeCompare(b.date+b.startTime);
  mine.sort(sortFn);

  if(mine.length===0 && flagged.length===0){
    return `<div class="card"><div class="empty">No classes found for "<b>${currentUser.name}</b>". Ask Admin to check the schedule upload.</div></div>`;
  }

  const geoStatusHtml = currentGeo.error
    ? `<div class="geo-note bad">⚠ ${currentGeo.error} — location is required to start or stop a session.</div>`
    : (currentGeo.lat===null
        ? `<div class="geo-note">Locating you…</div>`
        : `<div class="geo-note">📍 Location active (±${Math.round(currentGeo.accuracy||0)}m)</div>`);

  const flaggedHtml = flagged.length ? `<div class="warn-banner" style="margin-bottom:14px;">⚠ ${flagged.length} class(es) are tagged with your code but at a centre/vertical you're not mapped to (${flagged.slice(0,3).map(s=>centerName(s.center)+' · '+s.vertical).join(', ')}${flagged.length>3?', …':''}). They're hidden from your list below — ask Admin to fix the mapping or the schedule entry.</div>` : '';

  const cards = mine.map(s=>renderClassCard(s)).join('') || `<div class="empty">Nothing mapped to you at ${(facultyRecord(currentUser.name)?.centers||[]).map(centerName).join(', ')||'your centre'} yet.</div>`;
  return `<div class="card"><h3>Session tracking</h3><div class="hint">${geoStatusHtml}</div>${flaggedHtml}${cards}</div>`;
}

/* ================= STAKEHOLDER: ALL-TEACHER VISIBILITY ================= */
function isStakeholderView(){ return currentUser.viewAs==='stakeholder'; }
function isTeacherPersona(){ return currentUser.viewAs==='teacher' && !!currentUser.name; }
function facultyDisplay(code){ const f=facultyRecord(code); return f && f.name && f.name!==f.id ? `${f.name} (${f.id})` : code; }
function skFilters(){
  const f = window.__skFilters || { teacher:'all', center:'all', program:'all', mode:'all', range:'today' };
  window.__skFilters = f; return f;
}
function skFilteredSchedules(ignoreRange){
  const f = skFilters();
  let rows = state.schedules.slice();
  if(f.teacher!=='all') rows = rows.filter(s=>s.faculty.toLowerCase()===f.teacher.toLowerCase());
  if(f.center!=='all') rows = rows.filter(s=>s.center===f.center);
  if(f.program!=='all') rows = rows.filter(s=>String(s.program||'').toLowerCase()===f.program);
  if(f.mode!=='all') rows = rows.filter(s=>modeOf(s)===f.mode);
  if(!ignoreRange){
    const t=todayISO();
    const plus7 = new Date(Date.now()+7*86400000); const t7=`${plus7.getFullYear()}-${pad2(plus7.getMonth()+1)}-${pad2(plus7.getDate())}`;
    if(f.range==='today') rows = rows.filter(s=>s.date===t || s.status==='live');
    else if(f.range==='week') rows = rows.filter(s=>(s.date>=t && s.date<=t7) || s.status==='live');
    else if(f.range==='upcoming') rows = rows.filter(s=>s.date>=t || s.status==='live');

    ${s.actualStart ? `<div class="cc-meta" style="margin-top:8px;">Actual: ${new Date(s.actualStart).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} ${s.actualEnd? '– '+new Date(s.actualEnd).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'(in progress)'}${s.attendanceCount!=null?` · Attendance ${s.attendanceCount}${s.attendanceTotal!=null?'/'+s.attendanceTotal:''}`:''}${s.coverage?` · ${coverageLabel[s.coverage]||s.coverage}`:''}</div>` : ''}

/* ================= TEACHER UTILISATION ================= */
const DEFAULT_WEEKLY_HOURS = 24;
function weeklyTarget(code){ const f=facultyRecord(code); return f && f.weeklyHours ? f.weeklyHours : DEFAULT_WEEKLY_HOURS; }
// Target hours for the selected range: a day is 1/6 of the week (6 teaching days); "all time" spans the weeks that have sessions.
function rangeTargetHours(code, range){
  const w = weeklyTarget(code);
  if(range==='today') return w/6;
  if(range==='week') return w;
  const dates = state.schedules.map(s=>s.date).sort();
  if(!dates.length) return w;
  const span = (new Date(dates[dates.length-1]) - new Date(dates[0]))/86400000 + 1;
  return w * Math.max(1, Math.ceil(span/7));
}
function isMissed(s){ return s.status==='scheduled' && (s.date < todayISO() || isNoShowRisk(s)); }
function startDelayMin(s){ const d=new Date(s.actualStart); return (d.getHours()*60+d.getMinutes()) - minutesOfDay(s.startTime); }
function actualMin(s){ return Math.max(0, Math.round((new Date(s.actualEnd)-new Date(s.actualStart))/60000)); }
function teacherStats(code, range){
  const lc = code.toLowerCase();
  const all = state.schedules.filter(s=>s.faculty.toLowerCase()===lc);
  const scoped = all.filter(s=>inRange(s.date, range));
  const active = scoped.filter(s=>s.status!=='cancelled');
  const completed = scoped.filter(s=>s.status==='completed' && s.actualStart && s.actualEnd);
  const started = scoped.filter(s=>s.actualStart);
  const missed = scoped.filter(isMissed);
  const due = completed.length + missed.length + scoped.filter(s=>s.status==='live').length;
  const schedMin = active.reduce((a,s)=>a+scheduledDuration(s),0);
  const delivMin = completed.reduce((a,s)=>a+actualMin(s),0);
  const delays = started.map(startDelayMin);
  const onTimeStarts = delays.filter(d=>d<=5).length;
  const overs = completed.map(s=>actualMin(s)-scheduledDuration(s)).filter(x=>x>2);
  const att = completed.filter(s=>s.attendanceCount!=null && s.attendanceTotal>0);
  const cov = completed.filter(s=>s.coverage);
  const target = rangeTargetHours(code, range);
  const reqs = state.requests.filter(r=>r.requestedBy.toLowerCase()===lc && inRange(r.createdAt.slice(0,10), range));
  return {
    code, name: facultyDisplay(code), rec: facultyRecord(code), scoped, active, completed, missed,
    sessions: active.length, cancelled: scoped.filter(s=>s.status==='cancelled').length,
    schedH: schedMin/60, delivH: delivMin/60, targetH: target,
    loadPct: target ? schedMin/60/target*100 : null,
    completionPct: due ? completed.length/due*100 : null,
    punctualityPct: delays.length ? onTimeStarts/delays.length*100 : null,
    avgDelay: delays.length ? delays.reduce((a,b)=>a+b,0)/delays.length : null,
    overtimeCount: overs.length, avgOvertime: overs.length ? overs.reduce((a,b)=>a+b,0)/overs.length : null,
    attendancePct: att.length ? att.reduce((a,s)=>a+s.attendanceCount/s.attendanceTotal,0)/att.length*100 : null,
    coveragePct: cov.length ? cov.filter(s=>s.coverage==='full').length/cov.length*100 : null,
    onlineShare: active.length ? active.filter(isOnline).length/active.length*100 : null,
    centres: [...new Set(active.map(s=>s.center))], programs: [...new Set(active.map(s=>s.program).filter(p=>p&&p!=='—'))],
    covering: scoped.filter(s=>s.originalFaculty).length,
    requests: reqs.length, live: scoped.find(s=>s.status==='live') || null
  };
}
function allTeacherCodes(){
  const m=new Map();
  (state.faculty||[]).forEach(f=>m.set(f.id.toLowerCase(), f.id));
  state.schedules.forEach(s=>{ if(!m.has(s.faculty.toLowerCase())) m.set(s.faculty.toLowerCase(), s.faculty); });
  return [...m.values()];
}
const pct = v => v==null ? '—' : `${v.toFixed(0)}<small>%</small>`;
const pctTxt = v => v==null ? '—' : `${v.toFixed(0)}%`;
function loadColor(p){ if(p==null) return 'var(--ink-faint)'; if(p>110) return 'var(--red)'; if(p>=70) return 'var(--green)'; if(p>=40) return 'var(--amber)'; return 'var(--red)'; }
function loadBar(p){
  const w = p==null ? 0 : Math.min(100, p/1.3); // 130% fills the bar
  return `<div style="display:flex;align-items:center;gap:8px;min-width:130px;"><div class="barlist-track" style="flex:1;position:relative;"><div class="barlist-fill" style="width:${w}%;background:${loadColor(p)}"></div><div style="position:absolute;left:${100/1.3}%;top:-2px;bottom:-2px;width:1.5px;background:var(--ink-faint);" title="100% of target"></div></div><span class="mono" style="font-size:11.5px;width:38px;text-align:right;">${p==null?'—':p.toFixed(0)+'%'}</span></div>`;
}
function renderUtilisationCard(range){
  const uf = window.__utilFilters || { center:'all', vertical:'all', sort:'load' };
  window.__utilFilters = uf;
  const rangeLabel = {today:'today', week:'this week', all:'all time'}[range];
  let stats = allTeacherCodes().map(c=>teacherStats(c, range)).filter(t=>t.scoped.length || t.rec);

  if(uf.vertical!=='all') stats = stats.filter(t=> (t.rec&&t.rec.verticals.includes(uf.vertical)) || t.scoped.some(s=>s.vertical===uf.vertical));
  const sorters = {
    load:(a,b)=>(b.loadPct??-1)-(a.loadPct??-1), under:(a,b)=>(a.loadPct??999)-(b.loadPct??999),

  };
  stats.sort(sorters[uf.sort]||sorters.load);
  const tot = stats.reduce((a,t)=>({s:a.s+t.schedH, d:a.d+t.delivH, g:a.g+t.targetH}), {s:0,d:0,g:0});
  const over = stats.filter(t=>t.loadPct!=null && t.loadPct>110).length;

  const idle = stats.filter(t=>t.sessions===0).length;
  const rows = stats.map(t=>`<tr>
    <td><b>${esc(t.name)}</b>${t.live?` <span class="badge b-live" style="margin-left:4px;"><span class="pulse"></span> live</span>`:''}<br><span class="geo-note">${(t.rec?t.rec.centers:t.centres).map(centerName).map(esc).join(', ')||'not mapped'}</span></td>
    <td class="mono">${t.sessions}</td>
    <td class="mono">${t.schedH.toFixed(1)}h<br><span class="geo-note">of ${t.targetH.toFixed(0)}h target</span></td>
    <td>${loadBar(t.loadPct)}</td>
    <td class="mono">${t.delivH.toFixed(1)}h</td>
    <td class="mono">${pctTxt(t.completionPct)}</td>
    <td class="mono">${pctTxt(t.punctualityPct)}${t.avgDelay!=null?`<br><span class="geo-note">avg ${fmtMinutes(t.avgDelay)}</span>`:''}</td>
    <td class="mono">${pctTxt(t.attendancePct)}</td>
    <td class="mono" style="${t.missed.length?'color:var(--red);font-weight:700;':''}">${t.missed.length}</td>
    <td><button class="btn btn-outline btn-sm" data-open-teacher="${esc(t.code)}">Open</button></td>
  </tr>`).join('');
  return `
  <div class="card" style="margin-top:16px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
      <div><h3>Teacher utilisation</h3>
      <div class="hint">Scheduled teaching hours against each teacher's weekly target (set in Admin › Faculty mapping, default ${DEFAULT_WEEKLY_HOURS}h), ${rangeLabel}. Load: <span style="color:var(--green);font-weight:600;">70–110% healthy</span>, <span style="color:var(--amber);font-weight:600;">40–70% light</span>, <span style="color:var(--red);font-weight:600;">under 40% or over 110%</span>.</div></div>
    </div>
    <div class="bulk-summary" style="margin-top:0;">
      <span class="badge b-scheduled">${stats.length} teacher(s)</span>
      <span class="badge b-completed">${tot.s.toFixed(1)}h scheduled · ${tot.d.toFixed(1)}h delivered</span>
      <span class="badge b-scheduled">overall load ${tot.g?(tot.s/tot.g*100).toFixed(0):'—'}%</span>
      ${over?`<span class="badge b-cancelled">${over} over-loaded</span>`:''}
      ${under?`<span class="badge b-pending">${under} under-used</span>`:''}
      ${idle?`<span class="badge b-pending">${idle} with no sessions</span>`:''}
    </div>
    <div class="grid-toolbar">
      <select id="ut-center" aria-label="Centre"><option value="all">All centres</option>${state.centers.map(c=>`<option value="${c.id}" ${uf.center===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
      <select id="ut-vertical" aria-label="Vertical"><option value="all">All verticals</option>${state.verticals.map(v=>`<option value="${esc(v)}" ${uf.vertical===v?'selected':''}>${esc(v)}</option>`).join('')}</select>
      <select id="ut-sort" aria-label="Sort">${[['load','Sort: highest load'],['under','Sort: lowest load'],['missed','Sort: most missed'],['punctuality','Sort: least punctual'],['name','Sort: name']].map(([v,l])=>`<option value="${v}" ${uf.sort===v?'selected':''}>${l}</option>`).join('')}</select>
    </div>
    ${rows ? `<div class="table-wrap"><table><thead><tr><th>Teacher</th><th>Sessions</th><th>Scheduled</th><th>Load vs target</th><th>Delivered</th><th>Completion</th><th>Punctuality</th><th>Attendance</th><th>Missed</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="empty">No teachers match these filters.</div>`}
  </div>`;
}

/* ---- Individual teacher dashboard ---- */
function renderTeacherDashboardFor(code, opts){
  opts = opts || {};
  const range = window.__tdRange || 'week'; window.__tdRange = range;
  const t = teacherStats(code, range);
  const rangeLabel = {today:'today', week:'this week', all:'all time'}[range];
  const rec = t.rec;
  // This week's day-by-day hours (always the current week, so the chart has a stable shape)
  const now=new Date(); const sun=new Date(now); sun.setDate(now.getDate()-now.getDay());
  const days=[...Array(7)].map((_,i)=>{ const d=new Date(sun); d.setDate(sun.getDate()+i); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; });
  const lc=code.toLowerCase();
  const dayData = days.map(iso=>{
    const list=state.schedules.filter(s=>s.faculty.toLowerCase()===lc && s.date===iso && s.status!=='cancelled');
    return { iso, sched: list.reduce((a,s)=>a+scheduledDuration(s),0)/60, deliv: list.filter(s=>s.status==='completed'&&s.actualEnd).reduce((a,s)=>a+actualMin(s),0)/60 };
  });
  const dailyTarget = weeklyTarget(code)/6;
  const maxH = Math.max(dailyTarget, ...dayData.map(d=>Math.max(d.sched,d.deliv)), 1);
  const chart = `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;position:relative;margin-top:8px;">
    <div style="position:absolute;left:0;right:0;bottom:${dailyTarget/maxH*120+22}px;border-top:1.5px dashed var(--ink-faint);" title="Daily target ${dailyTarget.toFixed(1)}h"></div>
    ${dayData.map(d=>`<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <div style="display:flex;gap:3px;align-items:flex-end;height:120px;">
        <div title="Scheduled ${d.sched.toFixed(1)}h" style="width:14px;height:${d.sched/maxH*120}px;background:var(--teal-pale);border:1px solid var(--teal);border-radius:3px 3px 0 0;"></div>
        <div title="Delivered ${d.deliv.toFixed(1)}h" style="width:14px;height:${d.deliv/maxH*120}px;background:var(--teal);border-radius:3px 3px 0 0;"></div>
      </div>
      <div style="font-size:10.5px;color:${d.iso===todayISO()?'var(--teal-dark)':'var(--ink-faint)'};font-weight:${d.iso===todayISO()?800:600};">${new Date(d.iso+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short'})}</div>
    </div>`).join('')}
  </div>
  <div class="legend" style="margin-top:8px;"><span class="legend-item"><span class="legend-dot" style="background:var(--teal-pale);border:1px solid var(--teal);"></span>Scheduled</span><span class="legend-item"><span class="legend-dot" style="background:var(--teal)"></span>Delivered</span><span class="legend-item">- - daily target ${dailyTarget.toFixed(1)}h</span></div>`;

  // Where the hours go
  const byProg={}; t.active.forEach(s=>{ const k=cohortLabel(s); byProg[k]=(byProg[k]||0)+scheduledDuration(s); });
  const progEntries=Object.entries(byProg).sort((a,b)=>b[1]-a[1]).slice(0,8); const maxP=Math.max(1,...progEntries.map(e=>e[1]));
  const progRows = progEntries.map(([k,m])=>`<div class="barlist-row"><div class="lbl" title="${esc(k)}">${esc(k)}</div><div class="barlist-track"><div class="barlist-fill" style="width:${m/maxP*100}%"></div></div><div class="val">${(m/60).toFixed(1)}h</div></div>`).join('');
  const bySub={}; t.active.forEach(s=>{ bySub[s.subject]=(bySub[s.subject]||0)+scheduledDuration(s); });
  const subEntries=Object.entries(bySub).sort((a,b)=>b[1]-a[1]).slice(0,8); const maxS=Math.max(1,...subEntries.map(e=>e[1]));
  const subRows = subEntries.map(([k,m])=>`<div class="barlist-row"><div class="lbl" title="${esc(k)}">${esc(k)}</div><div class="barlist-track"><div class="barlist-fill" style="width:${m/maxS*100}%;background:var(--indigo)"></div></div><div class="val">${(m/60).toFixed(1)}h</div></div>`).join('');

  const upcoming = state.schedules.filter(s=>s.faculty.toLowerCase()===lc && s.status==='scheduled' && (s.date>todayISO() || (s.date===todayISO() && !isNoShowRisk(s)))).sort((a,b)=>(a.date+a.startTime).localeCompare(b.date+b.startTime)).slice(0,5);
  const recent = state.schedules.filter(s=>s.faculty.toLowerCase()===lc && (s.status==='completed' || isMissed(s))).sort((a,b)=>(b.date+b.startTime).localeCompare(a.date+a.startTime)).slice(0,8);
  const recentRows = recent.map(s=>{
    if(s.status!=='completed') return `<tr class="row-err"><td>${fmtDate(s.date)}</td><td>${esc(s.subject)}<br><span class="geo-note">${esc(cohortLabel(s))}</span></td><td colspan="3"><span class="badge b-noshow">⚠ never started</span></td></tr>`;
    const dl = s.actualStart ? startDelayMin(s) : null; const ov = s.actualEnd ? actualMin(s)-scheduledDuration(s) : null;
    return `<tr><td>${fmtDate(s.date)}</td><td>${esc(s.subject)}<br><span class="geo-note">${esc(cohortLabel(s))}</span></td>
      <td class="mono" style="color:${dl>5?'var(--amber)':'var(--green)'}">${dl==null?'—':(dl<=0?'on time':'+'+dl+'m')}</td>
      <td class="mono" style="color:${ov>2?'var(--amber)':'inherit'}">${ov==null?'—':(ov>2?'+'+ov+'m':'on time')}</td>
      <td class="mono">${s.attendanceCount!=null?`${s.attendanceCount}${s.attendanceTotal?'/'+s.attendanceTotal:''}`:'—'}</td></tr>`;
  }).join('');

  const cards = [
    kpiCard('Load vs target', pct(t.loadPct), `${t.schedH.toFixed(1)}h of ${t.targetH.toFixed(0)}h target`, t.loadPct==null?'':(t.loadPct>110||t.loadPct<40?'bad':t.loadPct<70?'warn':'good'), loadColor(t.loadPct)),
    kpiCard('Hours delivered', `${t.delivH.toFixed(1)}<small>h</small>`, `${t.completed.length} session(s) completed`, '', 'var(--teal)'),
    kpiCard('Sessions', t.sessions, `${t.cancelled} cancelled · ${t.onlineShare!=null?t.onlineShare.toFixed(0)+'% online':'—'}`, '', 'var(--indigo)'),
    kpiCard('Completion rate', pct(t.completionPct), t.missed.length?`${t.missed.length} session(s) never started`:'no missed sessions', t.missed.length?'bad':'good', 'var(--green)'),
    kpiCard('Punctuality', pct(t.punctualityPct), t.avgDelay!=null?`avg start ${fmtMinutes(t.avgDelay)} vs schedule`:'no sessions started yet', t.punctualityPct!=null&&t.punctualityPct<80?'warn':'good', 'var(--violet)'),
    kpiCard('Overtime', t.overtimeCount, t.avgOvertime!=null?`avg ${fmtMinutes(t.avgOvertime)} when running long`:'no sessions ran long', t.overtimeCount?'warn':'good', 'var(--amber)'),
    kpiCard('Avg. attendance', pct(t.attendancePct), 'of enrolled students present', t.attendancePct!=null&&t.attendancePct<70?'warn':'good', 'var(--teal)'),
    kpiCard('Syllabus fully covered', pct(t.coveragePct), `${t.covering} substitute cover(s) · ${t.requests} request(s)`, '', 'var(--green)')
  ].join('');

  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
        <div>
          <h3 style="font-size:17px;">${esc(t.name)}${t.live?` <span class="badge b-live" style="vertical-align:middle;"><span class="pulse"></span> live: ${esc(t.live.subject)}</span>`:''}</h3>
          <div class="center-meta" style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;">
            ${rec ? rec.centers.map(cid=>`<span class="tag" style="cursor:default;">${esc(centerName(cid))}</span>`).join('') + rec.verticals.map(v=>`<span class="tag" style="cursor:default;background:var(--indigo-pale);color:var(--indigo);">${esc(v)}</span>`).join('') : '<span class="geo-note bad">not in Faculty mapping</span>'}
            <span class="tag" style="cursor:default;background:#283835;color:var(--ink-soft);">target ${weeklyTarget(code)}h / week</span>
          </div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          ${opts.back ? `<button class="btn btn-outline btn-sm" data-td-back>‹ All teachers</button>` : ''}
          <div class="range-tabs">${[['today','Today'],['week','This week'],['all','All time']].map(([k,l])=>`<button data-td-range="${k}" class="${range===k?'active':''}">${l}</button>`).join('')}</div>
        </div>
      </div>
    </div>
    <div class="kpi-grid">${cards}</div>
    <div class="dash-cols">
      <div class="card"><h3>This week, day by day</h3><div class="hint">Scheduled vs delivered teaching hours for the current week.</div>${chart}</div>
      <div class="card"><h3>Next up</h3>
        ${upcoming.length ? upcoming.map(s=>`<div class="center-row"><div><div class="center-name">${esc(s.subject)}${s.chapter&&s.chapter!=='—'?' — '+esc(s.chapter):''}</div><div class="center-meta">${fmtDate(s.date)} · ${to12h(s.startTime)}–${to12h(s.endTime)} · ${esc(cohortLabel(s))} · ${esc(centerName(s.center))}${!isOnline(s)&&s.classroom?' · 🚪 '+esc(classroomName(s.classroom)):''}</div></div>${modePill(s)}</div>`).join('') : '<div class="empty">Nothing scheduled ahead.</div>'}
      </div>
    </div>
    <div class="dash-cols">
      <div class="card"><h3>Hours by program &amp; batch</h3><div class="hint">${rangeLabel}</div>${progRows || '<div class="empty">No sessions in this range.</div>'}
        <h3 style="margin-top:18px;">Hours by subject</h3>${subRows || '<div class="empty">No sessions in this range.</div>'}</div>
      <div class="card"><h3>Recent sessions</h3><div class="hint">Start punctuality, overtime and attendance for the latest sessions.</div>
        ${recentRows ? `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Session</th><th>Start</th><th>Finish</th><th>Attendance</th></tr></thead><tbody>${recentRows}</tbody></table></div>` : '<div class="empty">No completed sessions yet.</div>'}</div>
    </div>`;
}

/* ================= TEACHER: CALENDAR ================= */
function renderTeacherCalendar(){
  const sk = isStakeholderView();
  if(!sk && !currentUser.name){
    return `<div class="card"><div class="empty">Enter your faculty name / code above to see your calendar.</div></div>`;
  }
  const mine = sk ? skFilteredSchedules(true) : myScheduleSet().mine;

  const today = new Date();
  const cal = window.__calMonth || { year: today.getFullYear(), month: today.getMonth() };
  window.__calMonth = cal;
  const selected = window.__calSelected || todayISO();

  const first = new Date(cal.year, cal.month, 1);
  const startOffset = first.getDay(); // 0=Sun
  const daysInMonth = new Date(cal.year, cal.month+1, 0).getDate();
  const monthLabel = first.toLocaleDateString('en-GB', { month:'long', year:'numeric' });

  const byDate = {};
  mine.forEach(s=>{ (byDate[s.date] = byDate[s.date]||[]).push(s); });

  const statusDot = {scheduled:'#B3B4F1', live:'#0E6B63', completed:'#80CEA0', cancelled:'#F39183'};

  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell empty-cell"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${cal.year}-${String(cal.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayClasses = byDate[iso] || [];
    const dots = dayClasses.slice(0,4).map(s=>`<span class="cal-dot" style="background:${statusDot[s.status]||'#888'}"></span>`).join('');
    const isToday = iso===todayISO();
    const isSelected = iso===selected;
    cells += `<div class="cal-cell ${isToday?'is-today':''} ${isSelected?'is-selected':''} ${dayClasses.length?'has-classes':''}" data-cal-day="${iso}">
      <span class="cal-daynum">${d}</span>
      ${dayClasses.length ? `<div class="cal-dots">${dots}${dayClasses.length>4?`<span class="cal-more">+${dayClasses.length-4}</span>`:''}</div>` : ''}
    </div>`;
  }

  const dayList = (byDate[selected]||[]).sort((a,b)=>a.startTime.localeCompare(b.startTime));
  const dayListHtml = dayList.length
    ? dayList.map(s=> sk ? renderReadOnlyCard(s) : renderClassCard(s)).join('')
    : `<div class="empty">No classes on ${fmtDate(selected)}.</div>`;

  return `
  ${sk ? `<div class="card" style="padding-bottom:6px;"><h3>Filter the calendar</h3><div class="hint">Showing every teacher's sessions. Pick a teacher to see just their month.</div>${skToolbar(false)}</div>` : ''}
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <h3>${monthLabel}</h3>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-outline btn-sm" data-action="cal-prev">‹ Prev</button>
        <button class="btn btn-outline btn-sm" data-action="cal-today">Today</button>
        <button class="btn btn-outline btn-sm" data-action="cal-next">Next ›</button>
      </div>
    </div>
    <div class="cal-grid cal-head">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-headcell">${d}</div>`).join('')}
    </div>
    <div class="cal-grid">${cells}</div>
    <div class="legend" style="margin-top:12px;">
      <span class="legend-item"><span class="legend-dot" style="background:#B3B4F1"></span>Scheduled</span>
      <span class="legend-item"><span class="legend-dot" style="background:#0E6B63"></span>Live</span>
      <span class="legend-item"><span class="legend-dot" style="background:#80CEA0"></span>Completed</span>
      <span class="legend-item"><span class="legend-dot" style="background:#F39183"></span>Cancelled</span>
    </div>
  </div>
  <div class="card">
    <h3>${fmtDate(selected)}${selected===todayISO()?' · Today':''}</h3>
    <div class="hint">Tap any day in the calendar to see classes scheduled for that date.</div>
    ${dayListHtml}
  </div>`;
}

function renderClassCard(s){
  const online = isOnline(s);
  const near = online || isNearCenter(s.center);
  const dist = distanceToCenter(s.center);
  const pending = pendingRequestFor(s.id);
  const isLive = s.status==='live';
  const dur = scheduledDuration(s);
  let overtime = 0, exceeded = false;
  if(isLive && s.actualStart){
    const el = elapsedMinutes(s.actualStart);
    overtime = el - dur;
    exceeded = overtime > 0;
    if(exceeded && !warnedOnce.has(s.id)){
      warnedOnce.add(s.id);
      showToast(`"${s.subject}" (${cohortLabel(s)}) has run ${overtime}m past its scheduled end time.`);
    }
  }
  const noShow = isNoShowRisk(s);
  if(noShow && !noShowWarned.has(s.id)){
    noShowWarned.add(s.id);
    const lateBy = (()=>{ const n=new Date(); return (n.getHours()*60+n.getMinutes()) - minutesOfDay(s.startTime); })();
    logAudit('System', 'No-show flagged', `${s.subject} — ${s.chapter} at ${centerName(s.center)} hasn't started, ${lateBy}m past scheduled start`, s.id);
    saveState();
  }
  const canAct = s.status==='scheduled' || s.status==='live';
  const isToday = s.date===todayISO();
  const liveConflict = !isLive && hasFacultyLiveElsewhere(s.faculty, s.id);
  const startDisabled = !canAct || isLive || !near || pending || !isToday || !!liveConflict;
  const stopDisabled = !canAct || !isLive || !near;
  const canRequest = s.status==='scheduled' && !pending; // only future, unstarted, non-pending classes can be rescheduled/cancelled/substituted
  const lowAccuracy = currentGeo.accuracy && currentGeo.accuracy > (state.centers.find(c=>c.id===s.center)?.radius||300);
  const subs = eligibleSubstitutes(s);

  let geoNote;
  if(liveConflict){
    geoNote = `<span class="geo-note bad">✗ you're already live in "${liveConflict.subject}" — stop that session first</span>`;
  } else if(!isToday && s.status==='scheduled'){
    geoNote = `<span class="geo-note">scheduled for ${fmtDate(s.date)} — start unlocks that day</span>`;
  } else if(online){
    geoNote = `<span class="geo-note ok">🌐 online class — no location check</span>${safeLink(s.link)?` <a class="btn btn-outline btn-sm" href="${esc(safeLink(s.link))}" target="_blank" rel="noopener">Open class link</a>`:''}`;
  } else if(currentGeo.error){
    geoNote = `<span class="geo-note bad">location unavailable</span>`;
  } else if(currentGeo.lat===null){
    geoNote = `<span class="geo-note">location unknown</span>`;
  } else {
    geoNote = `<span class="geo-note ${near?'ok':'bad'}">${near? '✓ within range' : `✗ ${dist? Math.round(dist)+'m away — move closer' : 'out of range'}`}</span>${lowAccuracy?` <span class="geo-note warn" style="color:var(--amber);">(±${Math.round(currentGeo.accuracy)}m accuracy — may be unreliable)</span>`:''}`;
  }

  const coverageLabel = {full:'Fully covered', partial:'Partially covered', none:'Not covered'};
  const subBadgeText = { reschedule:'Reschedule pending', cancel:'Cancellation pending', substitute:'Substitute pending' };

  return `
  <div class="class-card ${isLive?'is-live':''} ${exceeded?'is-warn':''} ${noShow?'is-warn':''}" data-schedule="${s.id}">
    <div class="cc-top">
      <div>
        <div class="cc-title">${esc(s.subject)}${s.chapter && s.chapter!=='—' ? ' — '+esc(s.chapter) : ''} ${s.lectureNo && s.lectureNo!=='—' ? `<span style="color:var(--ink-faint);font-weight:500;">(${esc(s.lectureNo)})</span>` : ''}</div>
        <div class="cc-meta">${esc(programLabel(s))}${s.batch?` · <b>${esc(s.batch)}</b>`:''} · ${centerName(s.center)}${!isOnline(s)&&s.classroom?` · <span class="room-chip">🚪 ${esc(classroomName(s.classroom))}</span>`:''} ${modePill(s)} ${vpill(s.vertical)} ${typePill(s)}${s.originalFaculty?` · <span class="geo-note">covering for ${s.originalFaculty}</span>`:''}</div>
        <div class="cc-time">${fmtDate(s.date)} (${s.day}) · ${to12h(s.startTime)}–${to12h(s.endTime)} · scheduled ${dur}m</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
        ${statusBadge(s.status)}
        ${pending ? `<span class="badge b-pending">${subBadgeText[pending.type]}</span>` : ''}
        ${noShow ? `<span class="badge b-noshow">⚠ not started yet</span>` : ''}
      </div>
    </div>
    ${exceeded ? `<div class="warn-banner">⚠ Running ${overtime} minute${overtime===1?'':'s'} over the scheduled end time. Please wrap up or notify your coordinator.</div>` : ''}
    ${noShow ? `<div class="warn-banner">⚠ This class was due to start ${Math.round((new Date().getHours()*60+new Date().getMinutes())-minutesOfDay(s.startTime))}m ago and hasn't been started. If it's not happening, let your coordinator know.</div>` : ''}
    ${s.status!=='cancelled' ? `
    <div class="cc-actions">
      <button class="btn btn-teal btn-sm" data-action="start" data-id="${s.id}" ${startDisabled?'disabled':''}>▶ Mark entry / start</button>
      <button class="btn btn-red btn-sm" data-action="stop" data-id="${s.id}" ${stopDisabled?'disabled':''}>■ Mark exit / finish</button>
      ${geoNote}
      ${canRequest ? `<button class="btn btn-outline btn-sm" data-action="toggle-reschedule" data-id="${s.id}">Request reschedule</button>` : ''}
      ${canRequest ? `<button class="btn btn-outline btn-sm" data-action="toggle-cancel" data-id="${s.id}">Request cancellation</button>` : ''}
      ${canRequest ? `<button class="btn btn-outline btn-sm" data-action="toggle-substitute" data-id="${s.id}" ${subs.length===0?'disabled title="No other mapped faculty at this centre/vertical"':''}>Request substitute</button>` : ''}
      ${isLive ? `<span class="geo-note">reschedule/cancel/substitute is locked while a class is live</span>` : ''}
    </div>` : `<div class="cc-actions"><span class="geo-note">This session was cancelled.</span></div>`}

    ${isLive ? `
    <div class="req-form open" style="border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;">
      <div class="geo-note" style="margin-bottom:4px;">Session wrap-up (optional, saved when you stop the class)</div>
      <div class="req-row">
        <input type="number" min="0" id="att-present-${s.id}" placeholder="Present" value="${s.attendanceCount??''}">
        <input type="number" min="0" id="att-total-${s.id}" placeholder="Total enrolled" value="${s.attendanceTotal ?? (sessionStrength(s) ?? '')}">

/* ================= DASHBOARD / KPIs ================= */
function inRange(dateStr, range){
  if(range==='all') return true;
  const d = new Date(dateStr+'T00:00:00'), now = new Date();
  if(range==='today') return dateStr===todayISO();
  if(range==='week'){
    const start = new Date(now); start.setDate(now.getDate()-now.getDay());
    const end = new Date(start); end.setDate(start.getDate()+7);
    return d>=new Date(start.toDateString()) && d<new Date(end.toDateString());
  }
  return true;
}
function fmtMinutes(m){
  if(m===null || isNaN(m)) return '—';
  const h = Math.floor(Math.abs(m)/60), mm = Math.round(Math.abs(m)%60);
  const sign = m<0 ? '-' : '';
  return h>0 ? `${sign}${h}h ${mm}m` : `${sign}${mm}m`;
}
function computeKPIs(range){
  const scoped = state.schedules.filter(s=>inRange(s.date, range));
  const total = scoped.length;
  const byStatus = {scheduled:0, live:0, completed:0, cancelled:0};
  scoped.forEach(s=>byStatus[s.status]!==undefined && byStatus[s.status]++);

  const completedList = scoped.filter(s=>s.status==='completed' && s.actualEnd);
  const onTime = completedList.filter(s=>{
    const actualDur = Math.round((new Date(s.actualEnd)-new Date(s.actualStart))/60000);
    return actualDur <= scheduledDuration(s) + 2; // 2 min grace
  });
  const overtimeList = completedList.filter(s=>!onTime.includes(s));
  const avgOvertime = overtimeList.length
    ? overtimeList.reduce((sum,s)=>sum + (Math.round((new Date(s.actualEnd)-new Date(s.actualStart))/60000) - scheduledDuration(s)), 0) / overtimeList.length
    : null;
  const onTimeRate = completedList.length ? (onTime.length/completedList.length*100) : null;

  const startedList = scoped.filter(s=>s.actualStart);
  const startDelays = startedList.map(s=> (new Date(s.actualStart).getHours()*60+new Date(s.actualStart).getMinutes()) - minutesOfDay(s.startTime));
  const avgStartDelay = startDelays.length ? startDelays.reduce((a,b)=>a+b,0)/startDelays.length : null;
  const onTimeStarts = startDelays.filter(d=>d<=5).length;
  const punctualityRate = startDelays.length ? (onTimeStarts/startDelays.length*100) : null;

  const liveOvertimeNow = scoped.filter(s=>s.status==='live' && s.actualStart && elapsedMinutes(s.actualStart) > scheduledDuration(s)).length;

  const decided = state.requests.filter(r=>r.status!=='pending' && r.decidedAt);
  const turnarounds = decided.map(r=>(new Date(r.decidedAt)-new Date(r.createdAt))/60000);
  const avgTurnaround = turnarounds.length ? turnarounds.reduce((a,b)=>a+b,0)/turnarounds.length : null;

  const reqStats = {
    pending: state.requests.filter(r=>r.status==='pending').length,
    approved: state.requests.filter(r=>r.status==='approved').length,
    rejected: state.requests.filter(r=>r.status==='rejected').length,
    reschedule: state.requests.filter(r=>r.type==='reschedule').length,
    cancel: state.requests.filter(r=>r.type==='cancel').length,
  };
  const cancellationRate = total ? (byStatus.cancelled/total*100) : null;

  const centerCounts = {};
  scoped.forEach(s=>{ centerCounts[s.center] = (centerCounts[s.center]||0)+1; });
  const verticalCounts = {};
  scoped.forEach(s=>{ verticalCounts[s.vertical] = (verticalCounts[s.vertical]||0)+1; });

  const facultySet = new Set(scoped.map(s=>s.faculty));

  const noShowCount = scoped.filter(s=>isNoShowRisk(s)).length;

  const attendanceEligible = completedList.filter(s=>s.attendanceCount!=null && s.attendanceTotal!=null && s.attendanceTotal>0);
  const avgAttendanceRate = attendanceEligible.length
    ? attendanceEligible.reduce((sum,s)=>sum + (s.attendanceCount/s.attendanceTotal*100), 0) / attendanceEligible.length
    : null;

  const coverageEligible = completedList.filter(s=>s.coverage);
  const fullCoverageCount = coverageEligible.filter(s=>s.coverage==='full').length;
  const syllabusFullRate = coverageEligible.length ? (fullCoverageCount/coverageEligible.length*100) : null;
  const needsAnotherSession = coverageEligible.filter(s=>s.coverage==='none').length;
  const typeCounts = { 'academic':0, 'non-academic':0 };
  const categoryCounts = {};
  scoped.forEach(s=>{ const t=typeOf(s); typeCounts[t]=(typeCounts[t]||0)+1; const c=s.category||'Uncategorised'; categoryCounts[c]=(categoryCounts[c]||0)+1; });
  const roomMinutes = {};
  scoped.filter(s=>s.classroom && s.status!=='cancelled').forEach(s=>{ roomMinutes[s.classroom]=(roomMinutes[s.classroom]||0)+scheduledDuration(s); });
  const unroomed = scoped.filter(s=>!s.classroom && !isOnline(s) && typeOf(s)==='academic' && s.status!=='cancelled').length;
  const modeCounts = { offline:0, online:0 };
  scoped.forEach(s=>{ modeCounts[modeOf(s)]++; });

  reqStats.substitute = state.requests.filter(r=>r.type==='substitute').length;

  return { total, byStatus, onTimeRate, avgOvertime, avgStartDelay, punctualityRate, liveOvertimeNow,
    avgTurnaround, reqStats, cancellationRate, centerCounts, verticalCounts, facultyCount: facultySet.size, completedCount: completedList.length,
    noShowCount, avgAttendanceRate, attendanceEligibleCount: attendanceEligible.length, syllabusFullRate, coverageEligibleCount: coverageEligible.length, needsAnotherSession, typeCounts, categoryCounts, modeCounts, roomMinutes, unroomed };
}
