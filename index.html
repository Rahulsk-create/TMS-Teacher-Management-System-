function refreshScheduleForm(p){
  const typeEl=document.getElementById(p+'-type'); if(!typeEl) return;
  const type=typeEl.value, center=document.getElementById(p+'-center').value, vertical=document.getElementById(p+'-vertical').value;
  const acad = type==='academic';
  const catEl=document.getElementById(p+'-category'), prevCat=catEl.value;
  const cats=SESSION_CATEGORIES[type];
  catEl.innerHTML = catOptions(type, cats.includes(prevCat)?prevCat:cats[0]);

  const pEl=document.getElementById(p+'-program'), prevP=pEl.value;
  const pl=programsFor(center, vertical);
  const pNone = acad
    ? `<option value="">${pl.length?'Select a program…':'No programs for this centre & vertical — add one in Programs & Batches'}</option>`
    : `<option value="">All programs / general</option>`;
  pEl.innerHTML = pNone + pl.map(x=>`<option value="${x.id}" ${x.id===prevP?'selected':''}>${esc(x.name)}</option>`).join('');

  // A program's delivery mode becomes the session default whenever the program changes.
  const mEl=document.getElementById(p+'-mode');
  if(pEl.value && pEl.value!==pEl.dataset.lastProgram){ const pr=(state.programs||[]).find(x=>x.id===pEl.value); if(pr && pr.mode) mEl.value=pr.mode; }
  pEl.dataset.lastProgram = pEl.value;
  const online = mEl.value==='online';
  document.getElementById(p+'-classroom-wrap').style.display = online ? 'none' : '';
  document.getElementById(p+'-link-wrap').style.display = online ? '' : 'none';
  const bEl=document.getElementById(p+'-batch'), prevB=bEl.value;
  const bl = pEl.value ? batchesOf(pEl.value) : [];
  bEl.innerHTML = (pEl.value ? `<option value="">${bl.length?'All batches of this program':'Program has no batches — whole program'}</option>` : `<option value="">Pick a program first</option>`)
    + bl.map(b=>`<option value="${b.id}" ${b.id===prevB?'selected':''}>${esc(b.name)}${b.strength?` (${b.strength})`:''}</option>`).join('');
  bEl.disabled = !pEl.value || !bl.length;

  const rEl=document.getElementById(p+'-classroom'), prevR=rEl.value;
  const rl=roomsFor(center);
  rEl.innerHTML = `<option value="">${rl.length?'No room / not decided':'No classrooms set up for this centre'}</option>` + rl.map(r=>`<option value="${r.id}" ${r.id===prevR?'selected':''}>${esc(r.name)}${r.capacity?` · ${r.capacity} seats`:''}</option>`).join('');

  document.getElementById(p+'-subject-lbl').textContent = acad ? 'Subject' : 'Title';
  document.getElementById(p+'-chapter-lbl').textContent = acad ? 'Chapter' : 'Agenda / notes (optional)';
  document.getElementById(p+'-faculty-lbl').textContent = acad ? 'Faculty' : 'Faculty / host';
  document.getElementById(p+'-subject').placeholder = acad ? 'Physics' : 'Parent-teacher meeting';
  document.getElementById(p+'-chapter').placeholder = acad ? 'Units & Measurements' : 'Term 1 progress review';
}
function readScheduleForm(p){
  const v=id=>{ const el=document.getElementById(p+'-'+id); return el?el.value.trim():''; };

async function addProgram(){
  const name=document.getElementById('pg-name').value.trim();
  const center=document.getElementById('pg-center').value, vertical=document.getElementById('pg-vertical').value;
  const mode=document.getElementById('pg-mode').value==='online'?'online':'offline';
  if(!name){ showToast('Please give the program a name.'); return; }
  if((state.programs||[]).some(b=>b.center===center && b.name.toLowerCase()===name.toLowerCase())){ showToast('That program already exists at this centre.'); return; }
  state.programs.push({ id:uid(), name, center, vertical, strength:null, mode });
  logAudit(currentUser.coordinator||currentUser.name||'Admin','Added program',`${name} — ${centerName(center)} / ${vertical} · ${MODES[mode]}`);
  await saveState(); render(); showToast('Program added. Now add its batches.',3000);
}
async function addProgramBatch(){
  const programId=document.getElementById('bt-program').value, name=document.getElementById('bt-name').value.trim();
  const st=document.getElementById('bt-strength').value; const strength = st==='' ? null : parseInt(st);
  const p=state.programs.find(x=>x.id===programId);
  if(!p){ showToast('Pick a program.'); return; }
  if(!name){ showToast('Please give the batch a name.'); return; }
  if(strength!==null && (isNaN(strength)||strength<0)){ showToast('Strength should be a positive number.'); return; }
  if(batchesOf(programId).some(b=>b.name.toLowerCase()===name.toLowerCase())){ showToast(`"${p.name}" already has a batch called ${name}.`); return; }
  state.batches.push({ id:uid(), name, programId, strength });
  logAudit(currentUser.coordinator||currentUser.name||'Admin','Added batch',`${name} in ${p.name} (${centerName(p.center)})${strength!=null?' · '+strength+' students':''}`);
  await saveState(); render(); showToast('Batch added.',2500);
}
async function bulkPrograms(){
  const raw=document.getElementById('pg-bulk').value.trim(); if(!raw) return;
  const m=parseDelimited(raw); let pAdded=0, bAdded=0, bUpdated=0; const errs=[];
  m.forEach((r,i)=>{
    const [cName,vert,pName,bName,str,md]=r.map(x=>String(x||'').trim());
    const pmode = normMode(md);
    if(i===0 && /cent/i.test(cName) && /prog/i.test(pName||'')) return; // header
    if(!pName) return;
    const c=state.centers.find(x=>x.name.toLowerCase()===String(cName||'').toLowerCase());
    const v=state.verticals.find(x=>x.toLowerCase()===String(vert||'').toLowerCase());
    if(!c){ errs.push(`Row ${i+1}: centre "${cName}" not found`); return; }
    if(!v){ errs.push(`Row ${i+1}: vertical "${vert}" not found`); return; }
    let p=state.programs.find(b=>b.center===c.id && b.name.toLowerCase()===pName.toLowerCase());
    if(!p){ p={id:uid(), name:pName, center:c.id, vertical:v, strength:null, mode: pmode||'offline'}; state.programs.push(p); pAdded++; }
    else if(pmode) p.mode=pmode;
    if(!bName) return;
    const strength = str ? parseInt(str) : null;
    const ex=batchesOf(p.id).find(b=>b.name.toLowerCase()===bName.toLowerCase());
    if(ex){ if(strength!=null && !isNaN(strength)) ex.strength=strength; bUpdated++; }
    else { state.batches.push({id:uid(), name:bName, programId:p.id, strength: isNaN(strength)?null:strength}); bAdded++; }
  });
  if(pAdded||bAdded||bUpdated){ logAudit(currentUser.coordinator||currentUser.name||'Admin','Bulk-updated programs & batches',`${pAdded} program(s) added · ${bAdded} batch(es) added · ${bUpdated} updated`); await saveState(); render(); }
  showToast(`${pAdded} program(s) and ${bAdded} batch(es) added, ${bUpdated} batch(es) updated.${errs.length?' Skipped: '+errs.slice(0,3).join('; ')+(errs.length>3?'…':''):''}`, 6500);
}
async function removeProgram(id){
  const p=state.programs.find(x=>x.id===id); if(!p) return;
  const used=programUseCount(p);
  if(used){ showToast(`Can't remove — ${used} session(s) still use "${p.name}".`); return; }
  if(batchesOf(id).length){ showToast(`Remove the batches in "${p.name}" first.`); return; }
  state.programs=state.programs.filter(x=>x.id!==id);
  logAudit(currentUser.coordinator||currentUser.name||'Admin','Removed program',`${p.name} — ${centerName(p.center)}`);
  await saveState(); render();
}
async function removeProgramBatch(id){
  const bt=state.batches.find(x=>x.id===id); if(!bt) return;
  const used=batchUseCount(bt);
  if(used){ showToast(`Can't remove — ${used} session(s) are scheduled for ${bt.name}.`); return; }
  const p=state.programs.find(x=>x.id===bt.programId);
  state.batches=state.batches.filter(x=>x.id!==id);
  logAudit(currentUser.coordinator||currentUser.name||'Admin','Removed batch',`${bt.name}${p?' in '+p.name:''}`);
  await saveState(); render();
}

  if(!name){ showToast('Please give the room a name.'); return; }
  if(capacity!==null && (isNaN(capacity)||capacity<1)){ showToast('Capacity should be a positive number.'); return; }
  if(roomsFor(center).some(r=>r.name.toLowerCase()===name.toLowerCase())){ showToast('A room with that name already exists at this centre.'); return; }
  state.classrooms.push({ id:uid(), name, center, capacity });
  logAudit(currentUser.coordinator||currentUser.name||'Admin','Added classroom',`${name} — ${centerName(center)}${capacity?' ('+capacity+' seats)':''}`);
  await saveState(); render(); showToast('Classroom added.',2500);
}
async function bulkRooms(){
  const raw=document.getElementById('rm-bulk').value.trim(); if(!raw) return;
  const m=parseDelimited(raw); let added=0, updated=0; const errs=[];
  m.forEach((r,i)=>{
    const [cName,name,cap]=r.map(x=>String(x||'').trim());
    if(i===0 && /cent/i.test(cName) && /room|class/i.test(name||'')) return;
    if(!name) return;
    const c=state.centers.find(x=>x.name.toLowerCase()===String(cName||'').toLowerCase());
    if(!c){ errs.push(`Row ${i+1}: centre "${cName}" not found`); return; }
    const capacity = cap ? parseInt(cap) : null;
    const ex=roomsFor(c.id).find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(ex){ if(capacity && !isNaN(capacity)) ex.capacity=capacity; updated++; }
    else { state.classrooms.push({id:uid(), name, center:c.id, capacity: isNaN(capacity)?null:capacity}); added++; }
  });
  if(added||updated){ logAudit(currentUser.coordinator||currentUser.name||'Admin','Bulk-updated classrooms',`${added} added · ${updated} updated`); await saveState(); render(); }
  showToast(`${added} classroom(s) added, ${updated} updated.${errs.length?' Skipped: '+errs.slice(0,3).join('; ')+(errs.length>3?'…':''):''}`, 6500);
}
async function removeRoom(id){
  const r=classroomRec(id); if(!r) return;
  const used=state.schedules.filter(s=>s.classroom===id).length;
  if(used){ showToast(`Can't remove — ${used} session(s) are booked in ${r.name}.`); return; }
  state.classrooms=state.classrooms.filter(x=>x.id!==id);
  logAudit(currentUser.coordinator||currentUser.name||'Admin','Removed classroom',`${r.name} — ${centerName(r.center)}`);
  await saveState(); render();
}

async function startClass(id){
  if(busy) return; busy=true;
  try{
    const s = state.schedules.find(x=>x.id===id);
    if(!s) return;
    if(s.status!=='scheduled'){ showToast('This class is no longer in a state that can be started (already '+s.status+').'); render(); return; }
    if(s.date!==todayISO()){ showToast('You can only start this class on '+fmtDate(s.date)+'.'); return; }
    if(!isOnline(s) && !isNearCenter(s.center)){ showToast('You need to be near '+centerName(s.center)+' to start this class.'); return; }
    const liveElsewhere = hasFacultyLiveElsewhere(s.faculty, s.id);
    if(liveElsewhere){ showToast(`You already have "${liveElsewhere.subject}" live — stop it before starting another class.`); return; }
    s.status='live'; s.actualStart=new Date().toISOString(); s.actualEnd=null; s.entryReview={status:'pending'}; s.exitReview=null;
    noShowWarned.delete(id);
    logAudit(currentUser.name, 'Started class', `${s.subject} — ${s.chapter} at ${centerName(s.center)}`, id);
    await saveState(); render(); ensureTicker();
  } finally { busy=false; }
}
async function stopClass(id){
  if(busy) return; busy=true;
  try{
    const s = state.schedules.find(x=>x.id===id);
    if(!s) return;
    if(s.status!=='live'){ showToast('This class is not currently live.'); render(); return; }
    if(!isOnline(s) && !isNearCenter(s.center)){ showToast('You need to be near '+centerName(s.center)+' to stop this class.'); return; }

    const presentEl=document.getElementById('att-present-'+id), totalEl=document.getElementById('att-total-'+id), covEl=document.getElementById('coverage-'+id);
    let present = presentEl && presentEl.value!=='' ? parseInt(presentEl.value) : null;
    let total = totalEl && totalEl.value!=='' ? parseInt(totalEl.value) : null;
    const coverage = covEl && covEl.value ? covEl.value : null;
    if(present!==null && (isNaN(present) || present<0)){ showToast('Attendance present count should be a positive number.'); return; }
    if(total!==null && (isNaN(total) || total<0)){ showToast('Attendance total count should be a positive number.'); return; }

    if(total!==null) s.attendanceTotal=total;

    warnedOnce.delete(id);

    logAudit(currentUser.name, 'Stopped class', `${s.subject} — ${s.chapter}${attNote}${coverage?' · coverage: '+coverage:''}`, id);

  } finally { busy=false; }
}

async function decideRequest(reqId, decision){
  if(busy) return; busy=true;
  try{
    const r = state.requests.find(x=>x.id===reqId);
    if(!r || r.status!=='pending'){ showToast('This request has already been decided.'); render(); return; }
    const s = state.schedules.find(x=>x.id===r.scheduleId);
    if(!s){ showToast('The underlying class no longer exists.'); return; }
    if(!currentUser.coordinator){ showToast('Add your name under "Access view" in the sidebar before approving or rejecting.'); return; }

    let auditDetail = '';
    if(decision==='approved'){
      if(r.type==='reschedule'){
        if(isPastDate(r.newDate)){ showToast('The requested date has already passed — ask the teacher to resubmit with a new date.'); return; }
        const conflict = hasFacultyTimeConflict(s.faculty, r.newDate, r.newStart, r.newEnd, s.id);
        if(conflict){ showToast(`Can't approve — ${s.faculty} now has a conflicting class "${conflict.subject}" at that time. Resolve that first, or reject this request.`); return; }
        const roomClash = hasClassroomConflict(s.classroom, r.newDate, r.newStart, r.newEnd, s.id);
        if(roomClash){ showToast(`Can't approve — ${classroomName(s.classroom)} is now booked for "${roomClash.subject}" at that time.`); return; }
        const programClash = hasProgramConflict(s.program, s.center, r.newDate, r.newStart, r.newEnd, s.id, s.batch);
        if(programClash){ showToast(`Can't approve — "${cohortLabel(s)}" now has "${programClash.subject}" at that time.`); return; }
        auditDetail = `${s.subject} rescheduled ${fmtDate(s.date)} ${to12h(s.startTime)} → ${fmtDate(r.newDate)} ${to12h(r.newStart)}`;
        s.date=r.newDate; s.day=dayNameFor(r.newDate); s.startTime=r.newStart; s.endTime=r.newEnd;
        if(s.status==='completed'||s.status==='cancelled') s.status='scheduled';
      } else if(r.type==='cancel'){
        auditDetail = `${s.subject} — ${s.chapter} cancelled`;
        s.status='cancelled';
      } else if(r.type==='substitute'){
        const conflict = hasFacultyTimeConflict(r.proposedFaculty, s.date, s.startTime, s.endTime, s.id);
        if(conflict){ showToast(`Can't approve — ${r.proposedFaculty} now has a conflicting class "${conflict.subject}" at that time.`); return; }
        auditDetail = `${s.subject} — faculty changed ${s.faculty} → ${r.proposedFaculty}`;
        s.originalFaculty = s.originalFaculty || s.faculty;
        s.faculty = r.proposedFaculty;
      }
      logAudit(currentUser.coordinator, `Approved ${r.type}`, auditDetail, s.id);
    } else {
      logAudit(currentUser.coordinator, `Rejected ${r.type}`, `${s.subject} — ${s.chapter} (requested by ${r.requestedBy})`, s.id);
    }
    r.status = decision;
    r.decidedBy = currentUser.coordinator || 'Coordinator';
    r.decidedAt = new Date().toISOString();
    await saveState(); render();
  } finally { busy=false; }
}

/* ================= BULK UPLOAD ENGINE ================= */
const BULK_TEMPLATE_HEADERS = ['Date','Session Type','Category','Subject / Title','Chapter / Agenda','Lecture No','Faculty','Centre','Vertical','Program','Batch','Mode','Classroom','Class Link','Start (HH:MM)','End (HH:MM)'];
const BULK_FIELDS = ['date','sessionType','category','subject','chapter','lectureNo','faculty','center','vertical','program','batch','mode','classroom','link','startTime','endTime'];
const V4_FIELDS = ['date','sessionType','category','subject','chapter','lectureNo','faculty','center','vertical','program','batch','classroom','startTime','endTime'];
// Headerless files from the previous version: 13 columns, where the "Batch" column held what is now the program.
const V3_FIELDS = ['date','sessionType','category','subject','chapter','lectureNo','faculty','center','vertical','program','classroom','startTime','endTime'];
const LEGACY_FIELDS = ['date','subject','chapter','lectureNo','faculty','center','vertical','program','startTime','endTime'];
const BULK_ALIASES = {
  date:['date','classdate','sessiondate','day date'],
  sessionType:['sessiontype','type','scheduletype','academicnonacademic','academicornonacademic','academic'],
  category:['category','sessioncategory','activity','activitytype'],
  subject:['subjecttitle','subject','title','session','sessiontitle'],
  chapter:['chapteragenda','chapter','topic','agenda','notes'],
  lectureNo:['lectureno','lecture','lecturenumber','part','lectno'],
  faculty:['faculty','facultycode','teacher','teachercode','host','facultyhost'],
  center:['centre','center','centrename','centername','location','branch'],
  vertical:['vertical','course'],
  program:['program','programme','programname','programcode','course name'],
  batch:['batch','batchname','batchcode','section','group'],
  mode:['mode','programtype','deliverymode','onlineoffline','offlineonline','classmode','sessionmode'],
  link:['classlink','link','meetinglink','meetlink','zoomlink','url','onlinelink'],
  classroom:['classroom','room','classroomname','roomname','hall','roomno'],
  startTime:['starthhmm','start','starttime','from','fromtime','timefrom'],
  endTime:['endhhmm','end','endtime','to','totime','timeto']
};
const normHeader = h => String(h||'').toLowerCase().replace(/[^a-z0-9]/g,'');

function parseDelimited(text){
  const first = text.split(/\r?\n/)[0] || '';
  const delim = first.includes('\t') ? '\t' : (first.split(';').length > first.split(',').length ? ';' : ',');
  const rows=[]; let row=[], field='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else q=false; }
      else field+=ch;
    } else if(ch==='"' && field===''){ q=true; }
    else if(ch===delim){ row.push(field); field=''; }
    else if(ch==='\n' || ch==='\r'){ if(ch==='\r' && text[i+1]==='\n') i++; row.push(field); rows.push(row); row=[]; field=''; }
    else field+=ch;
  }
  row.push(field); rows.push(row);
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function pad2(n){ return String(n).padStart(2,'0'); }
function isoFromParts(y,m,d){
  const dt=new Date(y, m-1, d);
  if(dt.getFullYear()!==y || dt.getMonth()!==m-1 || dt.getDate()!==d) return '';
  return `${y}-${pad2(m)}-${pad2(d)}`;
}
const MONTHS = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
// Accepts Excel serials, YYYY-MM-DD, DD-MM-YYYY / DD/MM/YYYY (Indian day-first), and 07-Aug-2026 / 7 Aug 2026.
function normDate(v){
  if(v==null || v==='') return '';
  if(typeof v==='number' && isFinite(v)){
    const dt=new Date(Math.round((Math.floor(v)-25569)*86400000));
    return `${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth()+1)}-${pad2(dt.getUTCDate())}`;
  }
  if(v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad2(v.getMonth()+1)}-${pad2(v.getDate())}`;
  const t=String(v).trim();
  let m;
  if((m=t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return isoFromParts(+m[1],+m[2],+m[3]);
  if((m=t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))){ let y=+m[3]; if(y<100) y+=2000; return isoFromParts(y,+m[2],+m[1]); }
  if((m=t.match(/^(\d{1,2})[-\s\/.]([A-Za-z]{3,9})[-\s\/.,]*(\d{2,4})$/))){ const mo=MONTHS[m[2].toLowerCase().slice(0,3)]; let y=+m[3]; if(y<100) y+=2000; return mo?isoFromParts(y,mo,+m[1]):''; }
  if(/^\d{5}(\.\d+)?$/.test(t)) return normDate(parseFloat(t));
  return '';
}
// Accepts Excel day-fractions, 09:00, 9:00, 9.30, 9:00 AM, 2 PM, 14:30:00.
function normTime(v){
  if(v==null || v==='') return '';
  if(typeof v==='number' && isFinite(v)){
    const frac = v - Math.floor(v); const mins = Math.round(frac*1440) % 1440;
    return `${pad2(Math.floor(mins/60))}:${pad2(mins%60)}`;
  }
  const t=String(v).trim().toLowerCase().replace(/\s+/g,' ');
  const m=t.match(/^(\d{1,2})(?:[:.](\d{2}))?(?::\d{2})?\s*(am|pm|a\.m\.|p\.m\.)?$/);
  if(!m){ if(/^0?\.\d+$/.test(t)) return normTime(parseFloat(t)); return ''; }
  let h=+m[1], mi=m[2]?+m[2]:0; const ap=m[3]?m[3][0]:null;
  if(!m[2] && !ap) return '';
  if(ap){ if(h<1||h>12) return ''; if(ap==='p' && h<12) h+=12; if(ap==='a' && h===12) h=0; }
  if(h>23||mi>59) return '';
  return `${pad2(h)}:${pad2(mi)}`;
}
function cellText(v){ return v==null ? '' : String(v).trim(); }

// Works out which column is which. Returns {map:{field:colIndex}, headerRow:bool, legacy:bool}
function detectColumns(matrix){
  const head = (matrix[0]||[]).map(normHeader);
  const map = {}; let hits=0;
  BULK_FIELDS.forEach(f=>{
    const idx = head.findIndex((h,i)=> h && BULK_ALIASES[f].includes(h) && !Object.values(map).includes(i));
    if(idx>=0){ map[f]=idx; hits++; }
  });
  if(hits>=4){
    // Old header files had only "Batch" (which meant the program). Keep it as batch, and the row resolver falls back to it as the program.
    return { map, headerRow:true, legacy:false, batchAsProgram: map.program===undefined && map.batch!==undefined };
  }
  const width = Math.max(...matrix.slice(0,5).map(r=>r.length));
  const order = width>=16 ? BULK_FIELDS : width>=14 ? V4_FIELDS : (width>=13 ? V3_FIELDS : LEGACY_FIELDS);
  const m2={}; order.forEach((f,i)=>m2[f]=i);
  return { map:m2, headerRow:false, legacy: order===LEGACY_FIELDS };
}

function processBulkMatrix(matrix, sourceLabel){
  const preview=document.getElementById('bulk-preview');
  if(!matrix.length){ preview.innerHTML=`<div class="empty">That file has no rows.</div>`; return; }
  const { map, headerRow, legacy, batchAsProgram } = detectColumns(matrix);
  const missing = ['date','subject','faculty','center','vertical','startTime','endTime'].filter(f=>map[f]===undefined);
  if(missing.length){
    preview.innerHTML = `<div class="warn-banner" style="margin-top:12px;">Couldn't find these columns: ${missing.join(', ')}. Use the template headers (${BULK_TEMPLATE_HEADERS.join(', ')}).</div>`;
    return;
  }
  const autoCreate = !!(document.getElementById('bulk-autocreate')||{}).checked;
  const body = headerRow ? matrix.slice(1) : matrix;
  const firstRowNo = headerRow ? 2 : 1;
  const pendingPrograms = {}, pendingBatches = {}, pendingRooms = {};
  const results = [], accepted = [];

  body.forEach((r,i)=>{
    const rowNo = firstRowNo + i;
    const get = f => map[f]===undefined ? '' : r[map[f]];
    const E=[], W=[];
    const rawType = cellText(get('sessionType'));
    let category = cellText(get('category'));
    let sessionType = normType(rawType);
    if(sessionType===null){ E.push(`Session type "${rawType}" should be Academic or Non-academic.`); sessionType=''; }
    if(sessionType===''){
      const catNon = SESSION_CATEGORIES['non-academic'].some(c=>c.toLowerCase()===category.toLowerCase());
      sessionType = (!rawType || legacy) ? (catNon ? 'non-academic' : 'academic') : '';
    }
    if(sessionType){
      const canon = SESSION_CATEGORIES[sessionType].find(c=>c.toLowerCase()===category.toLowerCase());
      if(canon) category = canon;
      if(!category) category = sessionType==='academic' ? 'Lecture' : 'Other';
    }
    const rawDate=get('date'), rawStart=get('startTime'), rawEnd=get('endTime');
    const date = normDate(rawDate), startTime = normTime(rawStart), endTime = normTime(rawEnd);
    const cName = cellText(get('center')), vName = cellText(get('vertical'));
    const center = state.centers.find(c=>c.name.toLowerCase()===cName.toLowerCase());
    const vertical = state.verticals.find(v=>v.toLowerCase()===vName.toLowerCase());
    if(!center) E.push(cName ? `Centre "${cName}" doesn't exist — add it in Centres or fix the spelling.` : 'Centre is empty.');
    if(!vertical) E.push(vName ? `Vertical "${vName}" doesn't exist.` : 'Vertical is empty.');
    if(cellText(rawDate) && !date) E.push(`Couldn't read date "${cellText(rawDate)}" — use YYYY-MM-DD or DD-MM-YYYY.`);
    if(cellText(rawStart) && !startTime) E.push(`Couldn't read start time "${cellText(rawStart)}".`);
    if(cellText(rawEnd) && !endTime) E.push(`Couldn't read end time "${cellText(rawEnd)}".`);

    const d = { __row: rowNo, __label:`row ${rowNo}`, sessionType, category, date, startTime, endTime,
      subject: cellText(get('subject')), chapter: cellText(get('chapter')), lectureNo: cellText(get('lectureNo')),
      faculty: cellText(get('faculty')), center: center?center.id:'', vertical: vertical||'', program:'', programId:null, batch:'', batchId:null, classroom:null, classroomKey:null,
      mode:'offline', link: cellText(get('link')) };
    const rawMode = cellText(get('mode'));
    const parsedMode = normMode(rawMode);
    if(parsedMode===null) E.push(`Mode "${rawMode}" should be Offline or Online.`);

    // Program — must be a TMS program at that centre; Batch — must belong to that program
    let pName = cellText(get('program'));
    let btName = cellText(get('batch'));
    if(btName==='—') btName='';
    if(batchAsProgram && !pName && btName && center){
      const asProg = (state.programs||[]).find(x=>x.center===center.id && x.name.toLowerCase()===btName.toLowerCase());
      if(asProg){ pName = btName; btName = ''; }
    }
    let progKey = null;
    if(pName && pName!=='—' && center){
      const pr = (state.programs||[]).find(x=>x.center===center.id && x.name.toLowerCase()===pName.toLowerCase());
      if(pr){ d.program=pr.name; d.programId=pr.id; progKey=pr.id; }
      else if(autoCreate){ const k=center.id+'|'+pName.toLowerCase(); pendingPrograms[k]=pendingPrograms[k]||{name:pName, center:center.id, vertical:vertical||''}; d.program=pendingPrograms[k].name; d.__newProgram=k; progKey='new:'+k; W.push(`New program "${pName}" will be added to ${center.name}.`); }
      else E.push(`Program "${pName}" isn't set up at ${center.name} — add it in Programs & Batches or tick "create missing".`);
    }
    if(btName){
      if(!pName) E.push(`Batch "${btName}" is given without a program.`);
      else if(progKey){
        const bt = d.programId ? batchesOf(d.programId).find(x=>x.name.toLowerCase()===btName.toLowerCase()) : null;
        if(bt){ d.batch=bt.name; d.batchId=bt.id; }
        else if(autoCreate){ const k=progKey+'|'+btName.toLowerCase(); pendingBatches[k]=pendingBatches[k]||{name:btName, progKey}; d.batch=pendingBatches[k].name; d.__newBatch=k; W.push(`New batch "${btName}" will be added to "${pName}".`); }
        else E.push(`"${pName}" has no batch called "${btName}" — add it in Programs & Batches or tick "create missing".`);
      }
    }
    // Mode — from the column, else the program's type, else Offline
    const progMode = d.programId ? ((state.programs.find(x=>x.id===d.programId)||{}).mode) : (d.__newProgram ? (parsedMode||'offline') : null);
    d.mode = parsedMode || progMode || 'offline';
    if(d.__newProgram) pendingPrograms[d.__newProgram].mode = pendingPrograms[d.__newProgram].mode || d.mode;
    if(d.mode!=='online') d.link='';
    // Classroom — must be a room at that centre (ignored for online sessions)
    const rName = d.mode==='online' ? '' : cellText(get('classroom'));
    if(rName && rName!=='—' && center){
      const room = roomsFor(center.id).find(x=>x.name.toLowerCase()===rName.toLowerCase());
      if(room) d.classroom=room.id;
      else if(autoCreate){ const k=center.id+'|'+rName.toLowerCase(); pendingRooms[k]=pendingRooms[k]||{name:rName, center:center.id}; d.classroomKey='new:'+k; d.__newRoom=k; W.push(`New classroom "${rName}" will be added to ${center.name}.`); }
      else E.push(`Classroom "${rName}" isn't set up at ${center.name} — add it under Classrooms or tick "create missing".`);
    }
    if(!E.length){
      const v = validateSession(d, accepted, null);
      E.push(...v.errors); W.push(...v.warnings);
    }
    const status = E.length ? 'error' : (W.length ? 'warn' : 'ok');
    if(status!=='error') accepted.push(d);
    results.push({ rowNo, d, errors:E, warnings:W, status, raw:r });
  });

  window.__bulk = { results, accepted, pendingPrograms, pendingBatches, pendingRooms, source:sourceLabel, headerRow, legacy, map };
  renderBulkPreview();
}

async function commitBulk(){
  const B=window.__bulk; if(!B || !B.accepted.length) return;
  // Re-check against the latest shared state in case someone else booked a room meanwhile.
  const fresh=[]; const dropped=[];
  const bIds={}, rIds={};
  Object.entries(B.pendingPrograms).forEach(([k,b])=>{
    const ex=state.programs.find(x=>x.center===b.center && x.name.toLowerCase()===b.name.toLowerCase());
    if(ex) bIds[k]=ex.id; else { const nb={id:uid(), name:b.name, center:b.center, vertical:b.vertical, strength:null, mode:b.mode||'offline'}; state.programs.push(nb); bIds[k]=nb.id; }
  });
  const btIds={};
  Object.entries(B.pendingBatches||{}).forEach(([k,b])=>{
    const pid = String(b.progKey).startsWith('new:') ? bIds[b.progKey.slice(4)] : b.progKey;
    const ex=batchesOf(pid).find(x=>x.name.toLowerCase()===b.name.toLowerCase());
    if(ex) btIds[k]=ex.id; else { const nb={id:uid(), name:b.name, programId:pid, strength:null}; state.batches.push(nb); btIds[k]=nb.id; }
  });
  Object.entries(B.pendingRooms).forEach(([k,r])=>{
    const ex=roomsFor(r.center).find(x=>x.name.toLowerCase()===r.name.toLowerCase());
    if(ex) rIds[k]=ex.id; else { const nr={id:uid(), name:r.name, center:r.center, capacity:null}; state.classrooms.push(nr); rIds[k]=nr.id; }
  });
  B.accepted.forEach(d=>{
    const x={...d};
    if(x.__newProgram) x.programId=bIds[x.__newProgram];
    if(x.__newBatch) x.batchId=btIds[x.__newBatch];
    if(x.__newRoom){ x.classroom=rIds[x.__newRoom]; x.classroomKey=null; }
    const room = hasClassroomConflict(x.classroom, x.date, x.startTime, x.endTime, null);
    const bat = hasProgramConflict(x.program, x.center, x.date, x.startTime, x.endTime, null, x.batch);
    if(room||bat){ dropped.push(x.__row); return; }
    const rec=newSessionRecord(x);
    state.schedules.push(rec); fresh.push(rec);
  });
  const nb=Object.keys(B.pendingPrograms).length, nbt=Object.keys(B.pendingBatches||{}).length, nr=Object.keys(B.pendingRooms).length;
  logAudit(currentUser.coordinator||currentUser.name||'Admin', 'Bulk-added classes', `${fresh.length} session(s) from ${B.source}${nb||nbt||nr?` · created ${nb} program(s), ${nbt} batch(es), ${nr} room(s)`:''}${dropped.length?` · ${dropped.length} skipped for new clashes`:''}`);
  await saveState();
  window.__bulk=null;
  render();
  showToast(`Imported ${fresh.length} session(s).${dropped.length?` ${dropped.length} row(s) skipped because the room, program or batch got booked meanwhile (rows ${dropped.slice(0,6).join(', ')}).`:''}`, 6000);
}

function parseBulk(){
  const raw = document.getElementById('bulk-input').value;
  if(!raw.trim()) return;

function handleBulkFile(file){
  if(!file) return;
  const name=file.name||'file';
  const ext=name.split('.').pop().toLowerCase();
  if(file.size > 8*1024*1024){ showToast('That file is over 8 MB — split it into smaller uploads.'); return; }
  const reader=new FileReader();
  if(ext==='csv' || ext==='txt'){
    reader.onload=()=>processBulkMatrix(parseDelimited(String(reader.result).replace(/^\ufeff/,'')), name);
    reader.readAsText(file);
  } else if(ext==='xlsx' || ext==='xls' || ext==='xlsm'){
    if(typeof XLSX==='undefined'){ showToast('The Excel reader didn\'t load (offline?). Save the sheet as CSV and upload that instead.'); return; }
    reader.onload=()=>{
      try{
        const wb=XLSX.read(new Uint8Array(reader.result), {type:'array'});
        const sheetName = wb.SheetNames.find(n=>/schedule/i.test(n)) || wb.SheetNames[0];
        const matrix = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, raw:true, defval:''})
          .filter(r=>r.some(c=>String(c).trim()!==''));
        processBulkMatrix(matrix, `${name} · ${sheetName}`);
      }catch(e){ console.error(e); showToast('Couldn\'t read that Excel file — try saving it again as .xlsx or CSV.'); }
    };
    reader.readAsArrayBuffer(file);
  } else showToast('Please upload an .xlsx, .xls or .csv file.');
}

function parseRecurring(){
  const base = readScheduleForm('r');
  const from=document.getElementById('r-from').value;
  const until=document.getElementById('r-until').value;
  const days=[...document.querySelectorAll('.r-day-cb:checked')].map(cb=>parseInt(cb.value));
  const preview = document.getElementById('recurring-preview');
  if(!base.subject||!base.faculty||!base.startTime||!base.endTime||!from||!until){ showToast('Please fill in subject/title, faculty, both times, and the date range.'); return; }
  if(base.sessionType==='academic' && !base.programId){ showToast('Pick a program — academic sessions need one.'); return; }
  if(minutesOfDay(base.endTime)<=minutesOfDay(base.startTime)){ showToast('End time must be after the start time.'); return; }
  if(until<from){ showToast('"Until" date must be on or after "From" date.'); return; }
  if(days.length===0){ showToast('Pick at least one weekday for this series to repeat on.'); return; }
  const spanDays = (new Date(until)-new Date(from))/86400000;
  if(spanDays>366){ showToast('That range is over a year long — narrow it down so this stays manageable.'); return; }

  const parsed = [], skipped = [], warnSet = new Set();
  let d = new Date(from+'T00:00:00');
  const end = new Date(until+'T00:00:00');
  while(d<=end){
    if(days.includes(d.getDay())){
      const iso = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
      const row = {...base, date:iso, __label:fmtDate(iso)};
      const v = validateSession(row, parsed, null);
      const facultyClash = v.warnings.some(w=>w.includes('already has') || w.startsWith('Overlaps'));
      if(v.errors.length || facultyClash) skipped.push(`${fmtDate(iso)}: ${(v.errors[0] || v.warnings.find(w=>w.includes('already has')||w.startsWith('Overlaps')))} — skipped.`);
      else { parsed.push(row); v.warnings.filter(w=>w!=='Date is in the past.').forEach(w=>warnSet.add(w)); }
    }
    d.setDate(d.getDate()+1);
  }
  if(parsed.length===0){ preview.innerHTML = `<div class="empty">No sessions generated — check the date range and weekdays.</div>${skipped.length?`<div class="warn-banner" style="margin-top:10px;background:var(--amber-pale);color:#F0BC66;">${skipped.map(esc).join('<br>')}</div>`:''}`; return; }
  const warnings=[...warnSet, ...skipped];
  let html = `<div class="hint" style="margin-top:12px;">This will create <b>${parsed.length}</b> ${SESSION_TYPES[base.sessionType].toLowerCase()} session(s) (${esc(base.category)}) for ${esc(base.program ? cohortLabel(base) + (base.batch?'':' (all batches)') : 'all programs')}${base.classroom?` in ${esc(classroomName(base.classroom))}`:''}, from ${fmtDate(parsed[0].date)} to ${fmtDate(parsed[parsed.length-1].date)}.</div>`;
  html += `<table style="margin-top:8px;"><thead><tr><th>Date</th><th>Day</th><th>Time</th></tr></thead><tbody>`;
  html += parsed.slice(0,8).map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${dayNameFor(p.date)}</td><td>${to12h(p.startTime)}–${to12h(p.endTime)}</td></tr>`).join('');
  html += `</tbody></table>${parsed.length>8?`<div class="hint">…and ${parsed.length-8} more.</div>`:''}`;
  if(warnings.length) html += `<div class="warn-banner" style="margin-top:10px;background:var(--amber-pale);color:#F0BC66;">${warnings.map(esc).join('<br>')}</div>`;
  html += `<div style="margin-top:10px;"><button class="btn btn-teal btn-sm" id="btn-confirm-recurring">Add ${parsed.length} session(s) to schedule</button></div>`;
  preview.innerHTML = html;

  const confirmBtn = document.getElementById('btn-confirm-recurring');
  if(confirmBtn) confirmBtn.onclick = ()=>withLock(async ()=>{
    parsed.forEach(p=> state.schedules.push(newSessionRecord(p)));
    logAudit(currentUser.coordinator||currentUser.name||'Admin', 'Created recurring series', `${parsed.length} ${SESSION_TYPES[base.sessionType].toLowerCase()} session(s) of "${base.subject}" for ${base.faculty} · ${base.program?cohortLabel(base):'all programs'} at ${centerName(base.center)}, ${fmtDate(parsed[0].date)}–${fmtDate(parsed[parsed.length-1].date)}`);
    await saveState();
    render();
    showToast(`Added ${parsed.length} session(s) to the schedule.`, 4000);
  });
}

async function addSingleSchedule(keepForm){

  // Remember what was typed so "Add & keep form" only needs a new date/time for the next session.

    refreshScheduleForm('s');
    ['program'].forEach(k=>{ const el=document.getElementById('s-'+k); if(el) el.value=saved[k]; });
    refreshScheduleForm('s');
    ['category','date','batch','mode','classroom','link','subject','chapter','lecture','faculty','start','end'].forEach(k=>{ const el=document.getElementById('s-'+k); if(el) el.value=saved[k]; });

}

async function addCenterFromForm(){
  const name=document.getElementById('c-name').value.trim();
  const lat=parseFloat(document.getElementById('c-lat').value);
  const lng=parseFloat(document.getElementById('c-lng').value);
  const radius=parseInt(document.getElementById('c-radius').value)||300;
  if(!name||isNaN(lat)||isNaN(lng)){ showToast('Please provide a centre name and valid coordinates.'); return; }
  if(lat<-90||lat>90||lng<-180||lng>180){ showToast('Latitude must be -90..90 and longitude -180..180.'); return; }
  if(radius<20){ showToast('Geofence radius should be at least 20m to allow for GPS drift.'); return; }
  if(state.centers.some(c=>c.name.toLowerCase()===name.toLowerCase())){ showToast('A centre with that name already exists — use a distinct name so bulk uploads don\'t get confused.'); return; }
  state.centers.push({id:uid(), name, lat, lng, radius});
  logAudit(currentUser.coordinator||currentUser.name||'Admin', 'Added centre', `${name} (radius ${radius}m)`);
  await saveState(); render();
  showToast('Centre added.', 3000);
}

async function removeCenter(id){
  const inUse = state.schedules.filter(s=>s.center===id).length;
  const mapped = (state.faculty||[]).filter(f=>f.centers.includes(id)).length;
  if(inUse>0 || mapped>0){ showToast(`Can't remove — ${inUse} class(es) and ${mapped} faculty mapping(s) still reference this centre. Reassign or remove those first.`); return; }
  const removedName = centerName(id);
  state.centers = state.centers.filter(c=>c.id!==id);

async function addFacultyMapping(){

  if(verticals.length===0){ showToast('Select at least one vertical for this teacher.'); return; }
  const existingIdx = (state.faculty||[]).findIndex(f=>f.id.toLowerCase()===code.toLowerCase());
  const hrsRaw=(document.getElementById('f-hours')||{}).value;
  const prev = existingIdx>=0 ? state.faculty[existingIdx] : null;

  if(weeklyHours!=null && (isNaN(weeklyHours) || weeklyHours<=0 || weeklyHours>80)){ showToast('Weekly target should be between 1 and 80 hours.'); return; }

function validateStudentImport(matrix){
 if(!matrix.length)throw Error('The file is empty.');
 const headers=matrix[0].map(v=>String(v??'').trim().toLowerCase().replace(/[^a-z0-9]/g,''));
 const aliases={code:['admissionnumber','admissionno','studentid','code'],name:['studentname','name'],program:['program','programname'],batch:['batch','batchname'],contact:['guardiancontact','parentcontact','contact','phone']};
 const indices={};Object.entries(aliases).forEach(([k,names])=>indices[k]=headers.findIndex(h=>names.includes(h)));
 if(['code','name','program','batch'].some(k=>indices[k]<0))throw Error('Required columns: Admission number, Student name, Program, Batch.');
 const seen=new Set((state.students||[]).map(p=>p.code.toLowerCase()));
 return matrix.slice(1).map((cells,index)=>({cells,row:index+2})).filter(o=>o.cells.some(c=>String(c??'').trim())).map(({cells,row})=>{
  const value=k=>indices[k]<0?'':String(cells[indices[k]]??'').trim();
  const code=value('code'),name=value('name'),program=value('program'),batch=value('batch'),contact=value('contact'),errors=[];
  if(!code||code.length>40)errors.push('Admission number required (maximum 40 characters)');
  if(!name||name.length>100)errors.push('Student name required (maximum 100 characters)');
  if(contact.length>40)errors.push('Contact exceeds 40 characters');
  if(seen.has(code.toLowerCase()))errors.push('Duplicate admission number');
  const matches=state.batches.filter(b=>b.name.toLowerCase()===batch.toLowerCase()&&state.programs.some(p=>p.id===b.programId&&p.name.toLowerCase()===program.toLowerCase()));
  if(matches.length!==1)errors.push(matches.length?'Program / batch is ambiguous across centres':'Program / batch not found in Admin setup');
  if(!errors.length)seen.add(code.toLowerCase());
  return {row,code,name,contact,program,batch,batchId:matches[0]?.id,programId:matches[0]?.programId,errors};
 });
}

async function smsReadFile(file){if(!file||!file.size)return null;if(file.size>250*1024)throw Error('Document must be 250 KB or smaller.');if(!['application/pdf','image/png','image/jpeg'].includes(file.type))throw Error('Use a PDF, PNG or JPEG document.');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Could not read document.'));r.readAsDataURL(file);});return {name:file.name,type:file.type,data};}

async function smsSubmit(kind,form){const v=Object.fromEntries(new FormData(form).entries());for(const k in v)if(typeof v[k]==='string')v[k]=v[k].trim();let document=null;try{if(kind==='application'){smsRequireAdmin();document=await smsReadFile(v.document);}}catch(e){showToast(e.message);return;}

 else if(kind==='application'){smsRequireAdmin();if(!v.name||!v.code||!state.batches.some(b=>b.id===v.batchId))throw Error('Complete the applicant and batch fields.');if(state.students.some(p=>p.code.toLowerCase()===v.code.toLowerCase())||state.applications.some(a=>a.code.toLowerCase()===v.code.toLowerCase()))throw Error('Admission number already exists.');const b=state.batches.find(b=>b.id===v.batchId),full=b.strength&&state.students.filter(p=>!p.archived&&p.batchId===b.id).length>=b.strength;state.applications.push({id:uid(),name:v.name,code:v.code,batchId:v.batchId,contact:v.contact,document,status:full?'waitlisted':'applied',at:new Date().toISOString()});}

 if(action==='grades-export')return smsCSV('TMS-progress',[['Student','Subject','Assessment','Date','Score','Maximum'],...smsGradeRows().map(a=>[smsName(a.studentId),a.subject,a.title,a.date,a.score,a.max])]);
 if(action==='report-export')return smsCSV('TMS-student-report',[['Student','Attendance','Absent / late','Academic score','Follow-up'],...smsReportRows()]);
 if(action==='grade-remove'){const a=state.assessments.find(a=>a.id===id);if(!a||!smsPerson(a.studentId)||(!smsAdmin()&&a.by!==smsActor()))return;if(confirm('Remove this assessment score?'))await smsMutate('Removed assessment',()=>state.assessments=state.assessments.filter(a=>a.id!==id));return;}
 smsRequireAdmin();
 if(action==='backup')return downloadBlob('TMS-backup-'+todayISO()+'.json',JSON.stringify({format:'TMS-local-v2',exportedAt:new Date().toISOString(),data:state},null,2),'application/json');
 if(action==='messages-export')return smsCSV('TMS-message-drafts',[['Audience','Guardian contact','Subject','Message','Status'],...state.messages.map(m=>[m.studentId?smsName(m.studentId):m.batchId==='all'?'All students':state.batches.find(b=>b.id===m.batchId)?.name||'',m.studentId?state.students.find(p=>p.id===m.studentId)?.contact||'':'',m.subject,m.body,'Draft - not sent'])]);
 if(action==='document'){const doc=state.applications.find(a=>a.id===id)?.document;if(!doc)return;const bytes=Uint8Array.from(atob(doc.data.split(',')[1]),c=>c.charCodeAt(0));return downloadBlob(doc.name,bytes,doc.type);}
 if(action==='invoice-export'){const i=state.invoices.find(i=>i.id===id);if(i)return downloadBlob(i.number+'.txt',`TMS FEE INVOICE\n${i.number}\nStudent: ${smsName(i.studentId)}\nDescription: ${i.description}\nDue: ${i.due}\nAmount: ${smsMoney(i.amount)}\nOutstanding: ${smsMoney(smsBalance(i))}\nLocal record. Not a tax invoice.`,'text/plain');return;}
 if(action==='receipt'){const p=state.payments.find(p=>p.id===id),i=state.invoices.find(i=>i.id===p?.invoiceId);if(p&&i)return downloadBlob(p.number+'.txt',`TMS PAYMENT ACKNOWLEDGMENT\n${p.number}\nInvoice: ${i.number}\nStudent: ${smsName(i.studentId)}\nReceived: ${smsMoney(p.amount)}\nDate: ${p.date}\nReference: ${p.reference}\nRecorded by: ${p.by}\nManually recorded payment; not a tax receipt.`,'text/plain');return;}
 let message='';await smsMutate(action,()=>{
 if(action==='enroll')message=smsEnroll(id);
 else if(action==='waitlist'||action==='decline'){const a=state.applications.find(a=>a.id===id);if(a&&['applied','waitlisted'].includes(a.status))a.status=action==='waitlist'?'waitlisted':'declined';}
 else if(action==='exam-remove')state.exams=state.exams.filter(e=>e.id!==id);
 else if(action==='absence-drafts'){let count=0;const date=todayISO();for(const p of smsPeople()){if(state.studentAttendance[date]?.[p.id]?.status!=='absent'||state.messages.some(m=>m.studentId===p.id&&m.absenceDate===date))continue;state.messages.unshift({id:uid(),studentId:p.id,absenceDate:date,subject:'Attendance follow-up · '+date,body:`Dear parent/guardian, ${p.name} was marked absent on ${date}. Please contact the institution to confirm the reason.`,at:new Date().toISOString(),status:'draft'});count++;}message=count+' absence drafts prepared. Nothing has been sent.';}
 });if(message)showToast(message,5000);
 }catch(e){showToast(e.message);}
}
const smsHandlersBase=attachHandlers;attachHandlers=function(){smsHandlersBase();
 document.querySelectorAll('[data-sms-tab]').forEach(b=>b.onclick=()=>{smsTab=b.dataset.smsTab;render();});
 document.querySelectorAll('[data-sms-form]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');if(b.disabled)return;b.disabled=true;try{await smsSubmit(f.dataset.smsForm,f);}finally{b.disabled=false;}});
 document.querySelectorAll('[data-sms-action]').forEach(b=>b.onclick=async()=>{if(b.disabled)return;b.disabled=true;try{await smsAction(b.dataset.smsAction,b.dataset.smsId);}finally{b.disabled=false;}});
 const picker=document.getElementById('sms-person-pick');if(picker)picker.onchange=e=>{smsStudent=e.target.value;render();};
 for(const key of ['from','to']){const el=document.getElementById('sms-'+key);if(el)el.onchange=()=>{const from=document.getElementById('sms-from').value,to=document.getElementById('sms-to').value;if(!to||(from&&from>to))return showToast('Choose a valid date range.');smsFrom=from;smsTo=to;render();};}
 // Prevent existing student removal from orphaning academic or financial records.
 document.querySelectorAll('[data-student-remove]').forEach(b=>b.onclick=async()=>{if(!smsAdmin())return;const id=b.dataset.studentRemove;if(state.invoices.some(i=>i.studentId===id)||state.assessments.some(a=>a.studentId===id)||state.applications.some(a=>a.studentId===id)||state.studentNotes.some(n=>n.studentId===id)||state.messages.some(m=>m.studentId===id)){showToast('This student has linked records. Keep the profile to preserve their history.');return;}const p=state.students.find(p=>p.id===id);if(p&&confirm('Remove '+p.name+' and their attendance records?'))await smsMutate('Removed student',()=>{state.students=state.students.filter(p=>p.id!==id);Object.values(state.studentAttendance).forEach(r=>delete r[id]);});});
};

/* Hosted TMS adapter: credentials and authorization live on the server. */
smsActor=function(){return onlineUser?.name||'';};
let onlineUser=null,onlineCsrf='',onlineRevision=0,onlineSaving=false,onlineAccounts=[];
async function api(path,method='GET',data){const response=await fetch(path,{method,credentials:'same-origin',headers:{...(data!==undefined?{'Content-Type':'application/json'}:{}),...(method!=='GET'?{'X-CSRF-Token':onlineCsrf}:{})},...(data!==undefined?{body:JSON.stringify(data)}:{})});const result=await response.json();if(!response.ok){if(response.status===401&&path!=='/api/login'){onlineUser=null;state=null;stopGeoWatch();render();}throw Error(result.error||'Request failed.');}return result;}
loadState=async function(){const result=await api('/api/state');onlineRevision=result.revision;syncStatus={ok:true,lastSync:Date.now()};return normalizeState(result.state);};
saveState=async function(){if(onlineSaving){showToast('A save is in progress. Wait before making another change.');return false;}onlineSaving=true;try{const result=await api('/api/state','PUT',{revision:onlineRevision,state});onlineRevision=result.revision;state=normalizeState(result.state);syncStatus={ok:true,lastSync:Date.now()};return true;}catch(e){syncStatus={ok:false,lastSync:null};showToast(e.message,8000);return false;}finally{onlineSaving=false;}};
backgroundSync=async function(){if(!onlineUser||onlineUser.mustChange||onlineSaving||expandedRequestForm||document.querySelector('input:focus,textarea:focus,select:focus')||currentUser.role==='accounts'||currentUser.role==='password')return;try{const me=await api('/api/me');onlineUser=me.user;onlineCsrf=me.csrf;const result=await api('/api/state');if(result.revision!==onlineRevision){onlineRevision=result.revision;state=normalizeState(result.state);if(currentUser.role!=='admin'&&!(currentUser.role==='coordinator'&&window.__ovPanel))render();}}catch(e){if(onlineUser)showToast(e.message);}};
function onlineBindUser(){currentUser.viewAs=onlineUser.role==='teacher'?'teacher':onlineUser.role==='mentor'?'mentor':'stakeholder';currentUser.name=onlineUser.role==='teacher'?onlineUser.faculty:'';currentUser.coordinator=onlineUser.role==='teacher'?'':onlineUser.name;currentUser.stakeholder=currentUser.coordinator;}
async function onlineEnter(result){onlineUser=result.user;onlineCsrf=result.csrf;onlineBindUser();window.__ovPanel=null;window.__tdTeacher=null;window.studentEdit=null;expandedRequestForm=null;smsStudent='';smsTab='overview';activeSubTab.teacher='today';currentUser.role=onlineUser.mustChange?'password':onlineUser.role==='teacher'?'teacher':onlineUser.role==='mentor'?'attendance':'dashboard';if(!onlineUser.mustChange)state=await loadState();render();if(onlineUser.role==='teacher'&&!onlineUser.mustChange)startGeoWatch();}
function onlineLogin(){document.getElementById('app').innerHTML=`<main class="tms-auth"><div class="card tms-auth-card"><div class="brand-mark">TMS</div><h1 style="margin:20px 0">Teacher Management System</h1><h3>Staff sign-in</h3><p class="hint">Use the User ID and password provided by your administrator.</p><form id="online-login"><label for="online-user">User ID</label><input id="online-user" name="username" autocomplete="username" required maxlength="40" autocapitalize="none"><label for="online-pass">Password</label><input id="online-pass" name="password" type="password" autocomplete="current-password" required maxlength="128"><button class="btn btn-teal" style="margin-top:20px;width:100%;justify-content:center">Sign in</button><p id="online-error" role="alert"></p></form><p class="hint">Only the administrator can create accounts. Contact your administrator for a password reset.</p></div></main>`;document.getElementById('online-login').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button');b.disabled=true;try{await onlineEnter(await api('/api/login','POST',{username:f.elements.username.value,password:f.elements.password.value}));}catch(ex){document.getElementById('online-error').textContent=ex.message;b.disabled=false;}};}
function onlinePassword(){return `<div class="card"><h3>${onlineUser.mustChange?'Change your initial password':'Change password'}</h3><p class="hint">Use 12–128 characters. Changing your password signs out your other sessions.</p><form id="online-password"><div class="form-grid">${smsField('Current password','current','password','','required autocomplete="current-password"')}${smsField('New password','password','password','','required minlength="12" maxlength="128" autocomplete="new-password"')}${smsField('Confirm new password','confirm','password','','required minlength="12" maxlength="128" autocomplete="new-password"')}</div><div class="cc-actions"><button class="btn btn-teal">Save password</button></div><p id="online-password-error" role="alert"></p></form></div>`;}
function onlineUserPanel(){return `<div class="card"><h3>Create staff account</h3><p class="hint">The staff member must change this initial password before accessing records.</p><form id="online-create"><div class="form-grid">${smsField('User ID','username','text','','required minlength="3" maxlength="40"')}${smsField('Name','name','text','','required maxlength="100"')}${smsField('Initial password','password','password','','required minlength="12" maxlength="128" autocomplete="new-password"')}${smsSelect('Role','role','<option value="teacher">Teacher</option><option value="mentor">Mentor</option><option value="coordinator">Coordinator</option><option value="administrator">Administrator</option>')}${smsSelect('Teacher mapping','faculty','<option value="">Select for teacher accounts</option>'+state.faculty.map(f=>`<option value="${esc(f.id)}">${esc(facultyDisplay(f.id))}</option>`).join(''))}</div><div class="cc-actions"><button class="btn btn-teal">Create account</button></div><p id="online-create-error" role="alert"></p></form></div><div class="card"><h3>Staff accounts</h3>${smsTable(['User ID','Name','Role','Status','Actions'],onlineAccounts.map(a=>`<tr><td>${esc(a.username)}</td><td>${esc(a.name)}</td><td>${esc(a.role)}</td><td>${a.disabled?'Disabled':'Active'}</td><td>${a.id===onlineUser.id?'Current account':`<button class="btn btn-outline btn-sm" data-online-toggle="${a.id}" data-disabled="${a.disabled}">${a.disabled?'Enable':'Disable'}</button> <button class="btn btn-outline btn-sm" data-online-reset="${a.id}">Reset password</button>`}</td></tr>`))}<div id="online-reset-panel"></div><p id="online-account-error" role="alert"></p></div>`;}
renderPersonaBox=function(){return `<div class="persona"><label>Signed in</label><strong>${esc(onlineUser.name)}</strong><div class="p-note">${esc(onlineUser.username)} · ${esc(onlineUser.role)}</div><select id="persona-select" hidden disabled><option></option></select><div class="cc-actions"><button class="btn btn-outline btn-sm" id="online-signout">Sign out</button><button class="btn btn-outline btn-sm" id="online-password-open">Password</button></div>${onlineUser.role==='administrator'?'<button class="btn btn-teal btn-sm" id="online-accounts">User accounts</button>':''}</div>`;};
const onlineBodyBase=renderBody;renderBody=function(){if(currentUser.role==='accounts')return onlineUser.role==='administrator'?onlineUserPanel():'';if(currentUser.role==='password')return onlinePassword();return onlineBodyBase();};
const onlineRenderBase=render;render=function(){if(!onlineUser){if(!document.getElementById('online-login'))onlineLogin();return;}onlineBindUser();if(onlineUser.mustChange){document.getElementById('app').innerHTML=`<main class="tms-auth"><div style="max-width:750px;width:100%">${onlinePassword()}<button class="btn btn-outline" id="online-signout">Sign out</button></div></main>`;}else onlineRenderBase();
 const persona=document.getElementById('persona-select');if(persona){persona.disabled=true;persona.onchange=null;}
 const signout=document.getElementById('online-signout');if(signout)signout.onclick=async()=>{try{await api('/api/logout','POST',{});onlineUser=null;onlineCsrf='';state=null;onlineAccounts=[];stopGeoWatch();document.getElementById('app').innerHTML='';render();}catch(e){showToast(e.message);}};
 const pw=document.getElementById('online-password-open');if(pw)pw.onclick=()=>{currentUser.role='password';render();};
 const accounts=document.getElementById('online-accounts');if(accounts)accounts.onclick=async()=>{try{onlineAccounts=(await api('/api/users')).users;currentUser.role='accounts';render();}catch(e){showToast(e.message);}};
 const change=document.getElementById('online-password');if(change)change.onsubmit=async e=>{e.preventDefault();const b=change.querySelector('button');b.disabled=true;try{if(change.elements.password.value!==change.elements.confirm.value)throw Error('Passwords do not match.');await onlineEnter(await api('/api/password','POST',{current:change.elements.current.value,password:change.elements.password.value}));}catch(ex){document.getElementById('online-password-error').textContent=ex.message;b.disabled=false;}};
 const create=document.getElementById('online-create');if(create){create.elements.faculty.required=create.elements.role.value==='teacher';create.elements.role.onchange=()=>{create.elements.faculty.required=create.elements.role.value==='teacher';};create.onsubmit=async e=>{e.preventDefault();const b=create.querySelector('button');b.disabled=true;try{await api('/api/users','POST',Object.fromEntries(new FormData(create).entries()));onlineAccounts=(await api('/api/users')).users;render();showToast('Account created. Share the initial password privately.');}catch(ex){document.getElementById('online-create-error').textContent=ex.message;b.disabled=false;}};}
 document.querySelectorAll('[data-online-toggle]').forEach(b=>b.onclick=async()=>{try{await api('/api/users/'+b.dataset.onlineToggle,'POST',{action:b.dataset.disabled==='true'?'enable':'disable'});onlineAccounts=(await api('/api/users')).users;render();}catch(e){document.getElementById('online-account-error').textContent=e.message;}});
 document.querySelectorAll('[data-online-reset]').forEach(b=>b.onclick=()=>{const target=b.dataset.onlineReset;document.getElementById('online-reset-panel').innerHTML=`<form id="online-reset"><label for="reset-value">New initial password</label><input id="reset-value" name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"><button class="btn btn-teal">Reset password</button></form>`;document.getElementById('online-reset').onsubmit=async e=>{e.preventDefault();const f=e.target,btn=f.querySelector('button');btn.disabled=true;try{await api('/api/users/'+target,'POST',{action:'reset',password:f.elements.password.value});render();showToast('Password reset. All sessions for that account were revoked.');}catch(ex){document.getElementById('online-account-error').textContent=ex.message;btn.disabled=false;}};});
};
startClass=async function(id){if(busy)return;busy=true;try{await api('/api/teacher-attendance','POST',{id,action:'entry',lat:currentGeo.lat,lng:currentGeo.lng});state=await loadState();render();ensureTicker();}catch(e){showToast(e.message);}finally{busy=false;}};
stopClass=async function(id){if(busy)return;busy=true;try{const count=document.getElementById('att-present-'+id)?.value,total=document.getElementById('att-total-'+id)?.value;await api('/api/teacher-attendance','POST',{id,action:'exit',lat:currentGeo.lat,lng:currentGeo.lng,attendanceCount:count?Number(count):null,attendanceTotal:total?Number(total):null,coverage:document.getElementById('coverage-'+id)?.value||null});state=await loadState();render();}catch(e){showToast(e.message);}finally{busy=false;}};
reviewTmsAttendance=async function(id,stage,decision){try{await api('/api/attendance-review','POST',{id,stage,decision,note:document.getElementById('note-'+id+'-'+stage)?.value||''});state=await loadState();render();}catch(e){showToast(e.message);}};
smsOverview=function(){return smsCard('Shared student operations',`<div class="sms-tiles">${smsAllowed().filter(k=>k!=='overview').map(k=>`<button class="btn btn-outline" data-sms-tab="${k}">${smsTabs[k]}</button>`).join('')}</div><p>Student and teacher records are saved on the server. Your assigned role controls what the server returns and allows you to change.</p><p class="hint">Messages remain drafts and payments are manual records; no delivery or payment provider is connected.</p>`);};
smsSettings=function(){return smsCard('Server access controls','<p>Only administrators create staff accounts. The server checks sessions and permissions on each request. Password resets and disabling accounts revoke their sessions.</p><p>Database backups and encryption of server disks must be configured with your hosting provider. No legal compliance certification is claimed.</p>')+smsCard('Integrations','<p>No payment, messaging, LMS, HR or biometric service is connected. CSV exports are available for manual transfer.</p>')+smsCard('Server activity',smsTable(['Time','Actor','Action'],state.smsAudit.map(a=>`<tr><td>${esc(tmsTime(a.at))}</td><td>${esc(a.by)}</td><td>${esc(a.action)}</td></tr>`)));};
(async()=>{try{const me=await api('/api/me');await onlineEnter(me);ensureTicker();}catch(e){onlineUser=null;render();}})();

</script>
